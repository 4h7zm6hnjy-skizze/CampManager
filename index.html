<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173c29">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CampManager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>CampManager v23</title>
<style>
:root{
 --bg:#f5f2ea;--card:#fff;--ink:#142019;--muted:#6d766e;--line:#ddd7ca;
 --green:#173c29;--green2:#2e6548;--soft:#edf3ef;--danger:#a43e32;--gold:#c78b38;
 --shadow:0 10px 28px rgba(21,38,27,.08);--radius:20px;--safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;min-width:0}
button{cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:40;display:flex;flex-direction:column;gap:6px;padding:8px 12px;background:rgba(250,248,243,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.toprow,.subrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}.subrow{min-width:0}.topname{font-size:13px;color:var(--muted);font-weight:700;min-width:0;flex:1;white-space:normal;overflow-wrap:anywhere;line-height:1.2}
.brand{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:0;color:inherit;text-align:left;min-width:0}
.logo{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line)}
.brandcopy{min-width:0}.brandcopy b{font-size:16px;white-space:nowrap}
.ver{font-size:10px;background:var(--green);color:#fff;padding:2px 6px;border-radius:999px;vertical-align:2px}
.topright{display:flex;align-items:center;gap:6px}
.placebtn,.status{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-weight:800;font-size:12px;color:var(--ink)}
.placebtn{display:flex;align-items:center;gap:6px}
.placebtn img{width:23px;height:23px;border-radius:7px;object-fit:cover}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px}
main{max-width:1100px;margin:auto;padding:16px 14px calc(94px + var(--safe))}
.view{display:none}.view.active{display:block}
.hero{background:linear-gradient(135deg,#173c29,#10261a);color:#fff;border-radius:26px;padding:18px;display:grid;grid-template-columns:1.5fr .6fr;gap:14px;align-items:center;box-shadow:var(--shadow)}
.hero h1{margin:6px 0;font-size:28px}.hero p{margin:0;color:#dce7df}.hero img{width:100%;max-height:200px;object-fit:contain;background:#fff;border-radius:16px}
.badge{display:inline-flex;border-radius:999px;padding:4px 8px;background:#edf3ef;color:#2b5c3f;font-size:12px;font-weight:800}.hero .badge{background:rgba(255,255,255,.13);color:#fff}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:12px}
.card{grid-column:span 4;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.card.half{grid-column:span 6}.card.full{grid-column:1/-1}
.card h2,.card h3{margin:0 0 7px}.card h2{font-size:18px}.card h3{font-size:15px}.card p{margin:3px 0;color:var(--muted)}
.cardaction{border:1px solid var(--line);text-align:left;color:inherit}
.metric{font-size:28px;font-weight:850;letter-spacing:-.03em}.metric small{font-size:12px;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:13px}.head h1{margin:0;font-size:25px}.head p{margin:3px 0 0;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 13px}
.btn{border:0;background:var(--green);color:#fff;font-weight:800;padding:10px 13px;border-radius:12px}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.btn.block{width:100%}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs.manage-tabs{overflow:visible;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 0 12px}
.tabs.manage-tabs .chip{width:100%;min-height:44px;white-space:normal;text-align:center;line-height:1.15;padding:9px 7px}
.tabs.cost-tabs{overflow:visible;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:2px 0 12px}
.tabs.cost-tabs .chip{width:100%;min-height:44px;white-space:normal;text-align:center;line-height:1.12;padding:8px 6px;border-radius:13px;font-size:12.5px}
.tabs.cost-tabs .chip:last-child:nth-child(odd){grid-column:1/-1}

.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;font-size:13px;color:var(--ink)}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:15px;background:#fff;border:1px solid var(--line)}
.rowmain{flex:1;min-width:0}.rowtitle{font-weight:800;overflow-wrap:anywhere}.rowsub{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.rowactions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px}.mini.danger{color:var(--danger)}
.empty{padding:25px 14px;text-align:center;border:1px dashed #cfc6b8;border-radius:16px;color:var(--muted);background:rgba(255,255,255,.45)}
.notice{padding:11px;border:1px solid #dfd6bf;border-radius:14px;background:#f9f4e8;margin:10px 0}.notice.good{background:#eaf4ed;border-color:#cfe2d5}.notice.warn{background:#fff1da;border-color:#ecd8af}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}
.field input,.field select,.field textarea{width:100%;font-size:16px;line-height:1.2;border:1px solid #d9d2c5;background:#fff;border-radius:11px;padding:10px;color:var(--ink);outline:none}.field textarea{min-height:74px;resize:vertical}
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:8px;background:rgba(9,20,14,.58);backdrop-filter:blur(4px)}
.modalcard{width:min(100%,620px);max-height:calc(100dvh - 16px);overflow-y:auto;overflow-x:hidden;background:#faf8f3;border-radius:22px;border:1px solid var(--line);padding:12px;box-shadow:0 30px 90px rgba(0,0,0,.28)}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-12px;background:#faf8f3;padding:3px 0 8px;z-index:2}.modalhead h2{margin:0;font-size:23px}
.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:-12px;background:#faf8f3;padding:8px 0 2px;margin-top:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + var(--safe));background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav{border:0;background:transparent;border-radius:12px;padding:6px 3px;color:#6c756d;display:flex;flex-direction:column;align-items:center;gap:2px}.nav span{font-size:19px}.nav small{font-size:10px;font-weight:800}.nav.active{background:#edf3ef;color:var(--green)}
.toast{position:fixed;left:50%;bottom:86px;z-index:120;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#102319;color:#fff;padding:10px 14px;border-radius:999px;font-weight:750;transition:.2s;max-width:calc(100vw - 24px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}.quick b{display:block;font-size:20px}.quick small{color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:13px;object-fit:cover;background:#f2efe7;border:1px solid var(--line);flex:0 0 44px}.avatar.ph{display:grid;place-items:center;font-size:20px}
.photoPreview{width:88px;height:88px;border-radius:16px;object-fit:cover;background:#eee;border:1px solid var(--line)}
.costline{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:13px}.bar{height:8px;background:#eee8dd;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold))}.right{text-align:right}
.docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.doc{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px}.docthumb{width:100%;aspect-ratio:4/3;border-radius:11px;background:#f1eee7;display:grid;place-items:center;font-size:36px;overflow:hidden}.docthumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.conversation{white-space:pre-wrap;line-height:1.42;margin-top:6px}
.divider{height:1px;background:var(--line);margin:14px 0}
.updatebanner{position:sticky;top:82px;z-index:39;margin:8px auto 0;max-width:1100px;padding:10px 14px;background:#fff1da;border:1px solid #e4c982;border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px}
.progress{height:10px;background:#e9e5dc;border-radius:999px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold));border-radius:999px}
.kpirow{display:flex;justify-content:space-between;gap:10px;align-items:center}.kpirow strong{font-size:20px}
.comparetable{width:100%;border-collapse:collapse;font-size:13px}.comparetable th,.comparetable td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right}.comparetable th:first-child,.comparetable td:first-child{text-align:left}.delta.up{color:var(--danger)}.delta.down{color:var(--green2)}
.deadline-overdue{color:var(--danger);font-weight:800}.cloudtag{display:inline-flex;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;background:var(--soft);color:var(--green2);margin-left:5px}
.rentextras{grid-column:1/-1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px}.rentextra{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:7px;align-items:end;margin-top:8px}.rentextra .field{margin:0}
@media(max-width:600px){.rentextra{grid-template-columns:1fr 1fr}.rentextra .field:first-child{grid-column:1/-1}.rentextra button{align-self:end}.updatebanner{top:78px;margin-left:8px;margin-right:8px}}
@media(max-width:760px){
 .head{margin-bottom:10px}
 .head h1{font-size:24px;line-height:1.1}
 .head p{font-size:14px;line-height:1.25}
 .tabs.manage-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tabs.manage-tabs .chip{font-size:13px;border-radius:13px}

 .hero{grid-template-columns:1fr}.hero img{max-height:240px}.card,.card.half{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick{grid-template-columns:repeat(2,1fr)}.docgrid{grid-template-columns:1fr}.costline{grid-template-columns:115px 1fr 75px}.top{padding-left:10px;padding-right:10px}.topname{font-size:12px}.placebtn,.status{font-size:11px;padding:6px 8px}.logo{width:44px;height:44px}
}
@media(min-width:900px){.bottom{left:50%;right:auto;transform:translateX(-50%);width:620px;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}}

@media(min-width:761px){
 .top{gap:4px}
 .subrow{padding-left:57px}
 .topname{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}


@media(min-width:761px){
 .tabs.manage-tabs{grid-template-columns:repeat(4,minmax(0,1fr))}
 .tabs.cost-tabs{grid-template-columns:repeat(4,minmax(0,1fr))}
 .tabs.cost-tabs .chip:last-child:nth-child(odd){grid-column:auto}
}

</style>
</head>
<body>
<header class="top">
 <div class="toprow">
  <button class="brand" id="homeBtn" type="button">
   <img class="logo" id="logoImg" src="logo.jpg" alt="Logo">
   <div class="brandcopy"><b>CampManager <span class="ver">v23</span></b></div>
  </button>
  <div class="topright">
   <span class="status" id="syncStatus">Lokal</span>
   <button class="iconbtn" id="settingsBtn" type="button">⚙</button>
  </div>
 </div>
 <div class="subrow">
  <div id="topName" class="topname">Campingplatz</div>
  <button class="placebtn" id="placeBtn" type="button"><span>Platz ▾</span></button>
 </div>
</header>
<div id="updateBanner" class="updatebanner hidden"><div><b>Neue CampManager-Version verfügbar</b><div class="rowsub">Aktualisieren lädt die neue Version ohne alte Web-App-Dateien.</div></div><button class="btn" id="updateBtn" type="button">Aktualisieren</button></div>

<main>
 <section id="v-dashboard" class="view active"></section>
 <section id="v-shopping" class="view"></section>
 <section id="v-costs" class="view"></section>
 <section id="v-care" class="view"></section>
 <section id="v-more" class="view"></section>
</main>

<nav class="bottom">
 <button class="nav active" data-view="dashboard"><span>⌂</span><small>Start</small></button>
 <button class="nav" data-view="shopping"><span>✓</span><small>Einkäufe</small></button>
 <button class="nav" data-view="costs"><span>€</span><small>Kosten</small></button>
 <button class="nav" data-view="care"><span>♧</span><small>Pflege</small></button>
 <button class="nav" data-view="more"><span>•••</span><small>Mehr</small></button>
</nav>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
 <div class="modalcard">
  <div class="modalhead"><h2 id="modalTitle">Eintrag</h2><button class="iconbtn" type="button" data-close>×</button></div>
  <div id="modalBody"></div>
  <div id="modalActions" class="modalactions"></div>
 </div>
</div>
<div id="toast" class="toast"></div>

<script>
(()=>{'use strict';

const APP_VERSION=23;
const KEY='campmanager_complete_v23';
const OLD=['campmanager_complete_v22','campmanager_complete_v21','campmanager_complete_v20','campmanager_complete_v19','campmanager_complete_v18','campmanager_complete_v17','campmanager_complete_v16','campmanager_complete_v15','campmanager_complete_v14','campmanager_complete_v13','campmanager_complete_v12','campmanager_complete_v11','campmanager_complete_v10','campmanager_complete_v9','campmanager_complete_v8','campmanager_complete_v7','campmanager_complete_v6','campmanager_full_v5','campmanager_full_v4','campmanager_full_v3','campmanager_full_v2','campmanager_full_v1'];
const CFG='campmanager_cloud_cfg_v16', SES='campmanager_cloud_session_v16', BACKUP_DAY='campmanager_backup_day_v23', MONTH_BACKUP='campmanager_month_backup_v23', MONTH_SNOOZE='campmanager_month_backup_snooze_v23';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(16).slice(2);
const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10), yearNow=()=>new Date().getFullYear();
const fmt=v=>v?new Date(v+'T12:00:00').toLocaleDateString('de-DE'):'–';
const money=v=>Number(v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num=(v,d=0)=>Number(v||0).toLocaleString('de-DE',{maximumFractionDigits:d});
const dparse=v=>v?new Date(v+'T12:00:00'):null;
const nights=(a,b)=>a&&b?Math.max(0,Math.round((dparse(b)-dparse(a))/86400000)):0;

function blankPlace(name='Campingplatz',pitch='161'){
 return {id:uid(),site:{campName:name,pitch,area:'',notes:'',photoData:''},shopping:[],costs:[],annualRent:[],petroleum:[],electricity:[],stays:[],lawn:[],hedge:[],contracts:[],gasChecks:[],deadlines:[],documents:[],conversations:[]}
}
function defaults(){
 const p=blankPlace('Campingplatz','161');
 return {version:23,updatedAt:new Date().toISOString(),activePlaceId:p.id,family:[{id:uid(),name:'Marcel'},{id:uid(),name:'Denise'},{id:uid(),name:'Leon'},{id:uid(),name:'Luca'}],places:[p]}
}
function normPlace(p={}){
 return {
  id:p.id||uid(),
  site:{campName:'Campingplatz',pitch:'',area:'',notes:'',photoData:'',...(p.site||{})},
  shopping:Array.isArray(p.shopping)?p.shopping:[],
  costs:Array.isArray(p.costs)?p.costs:[],
  annualRent:Array.isArray(p.annualRent)?p.annualRent:[],
  petroleum:Array.isArray(p.petroleum)?p.petroleum:[],
  electricity:Array.isArray(p.electricity)?p.electricity:[],
  stays:Array.isArray(p.stays)?p.stays:[],
  lawn:Array.isArray(p.lawn)?p.lawn:[],
  hedge:Array.isArray(p.hedge)?p.hedge:[],
  contracts:Array.isArray(p.contracts)?p.contracts:[],
  gasChecks:Array.isArray(p.gasChecks)?p.gasChecks:[],
  deadlines:Array.isArray(p.deadlines)?p.deadlines:[],
  documents:Array.isArray(p.documents)?p.documents:[],
  conversations:Array.isArray(p.conversations)?p.conversations:[]
 }
}
function normalize(raw){
 const d=defaults(); if(!raw||typeof raw!=='object')return d;
 if(Array.isArray(raw.places)&&raw.places.length){
  const places=raw.places.map(normPlace);
  return {version:23,updatedAt:raw.updatedAt||new Date().toISOString(),activePlaceId:places.some(p=>p.id===raw.activePlaceId)?raw.activePlaceId:places[0].id,family:Array.isArray(raw.family)?raw.family:d.family,places}
 }
 const p=normPlace(raw);
 return {version:23,updatedAt:raw.updatedAt||new Date().toISOString(),activePlaceId:p.id,family:Array.isArray(raw.family)?raw.family:d.family,places:[p]}
}
function load(){
 try{
  const cur=localStorage.getItem(KEY); if(cur)return normalize(JSON.parse(cur));
  for(const k of OLD){const x=localStorage.getItem(k);if(x)return normalize(JSON.parse(x))}
 }catch(e){console.warn(e)}
 return defaults()
}
let state=load(), view='dashboard';
const tab={costs:'overview',care:'lawn',more:'stays'};
function place(){return state.places.find(p=>p.id===state.activePlaceId)||state.places[0]}
function persist(){
 state.version=23;state.updatedAt=new Date().toISOString();
 try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Speichern im Browser fehlgeschlagen');return false}
}
function save(){const ok=persist();render();schedulePush();scheduleDailyBackup();return ok}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2100)}
function empty(t){return `<div class="empty">${esc(t)}</div>`}
function tabs(sec,items){
 const extra=sec==='more'?' manage-tabs':sec==='costs'?' cost-tabs':'';
 return `<div class="tabs${extra}">${items.map(([k,l])=>`<button type="button" class="chip ${tab[sec]===k?'active':''}" data-tabsec="${sec}" data-tab="${k}">${esc(l)}</button>`).join('')}</div>`
}
function avatar(p,cls='avatar'){return p.site.photoData?`<img class="${cls}" src="${p.site.photoData}" alt="">`:`<span class="${cls} ph">⛺</span>`}

function petroleumStock(p=place()){
 let s=0;[...p.petroleum].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||''))).forEach(x=>{
  const l=Number(x.liters||0); if(x.kind==='stock')s=l;else if(x.kind==='purchase')s+=l;else s-=l
 });return s
}
function totalNights(p=place(),y=null){return p.stays.reduce((sum,x)=>sum+((!y||Number((x.arrival||'').slice(0,4))===Number(y))?nights(x.arrival,x.departure):0),0)}
function rentAuto(x){return x?.autoExtra?x.autoExtra==='yes':!(Number(x?.extraAdultNights||0)||Number(x?.extraChildNights||0))}
function rentNightInfo(p,x){
 const included=Number(x?.includedNights||90),used=totalNights(p,Number(x?.year)||yearNow()),over=Math.max(0,used-included);
 return {included,used,over,remaining:Math.max(0,included-used),percent:included?Math.min(100,used/included*100):100}
}
function rentPersonNights(p,x){
 const n=rentNightInfo(p,x);
 if(rentAuto(x))return {adult:n.over*Number(x?.adultCount||0),child:n.over*Number(x?.childCount||0)};
 return {adult:Number(x?.extraAdultNights||0),child:Number(x?.extraChildNights||0)}
}
function rentExtraTotal(x){return (Array.isArray(x?.extras)?x.extras:[]).reduce((sum,e)=>sum+Number(e.qty||0)*Number(e.price||0),0)}
function annualRentTotal(x,p=place()){
 if(!x)return 0;const pn=rentPersonNights(p,x);
 return Number(x.baseAmount||0)+pn.adult*Number(x.adultPrice||0)+pn.child*Number(x.childPrice||0)+Number(x.carCount||0)*Number(x.carAnnualPrice||0)+Number(x.trailerCount||0)*Number(x.trailerAnnualPrice||0)+rentExtraTotal(x)
}
function annualRentFor(p,y){return p.annualRent.find(x=>Number(x.year)===Number(y))||null}
function contractActive(x,y){
 const a=y+'-01-01',b=y+'-12-31';
 return !(x.startDate&&x.startDate>b)&&!(x.endDate&&x.endDate<a)
}
function contractBaseAmount(x){return Number(x.costAmount ?? x.annualCost ?? 0)}
function contractBillingPeriod(x){return x.billingPeriod||'yearly'}
function contractMonthsInYear(x,y){
 if(!contractActive(x,y))return 0;
 let startMonth=1,endMonth=12;
 if(x.startDate&&Number(x.startDate.slice(0,4))===Number(y))startMonth=Number(x.startDate.slice(5,7))||1;
 if(x.endDate&&Number(x.endDate.slice(0,4))===Number(y))endMonth=Number(x.endDate.slice(5,7))||12;
 return Math.max(0,endMonth-startMonth+1)
}
function contractCostForYear(x,y){
 const amount=contractBaseAmount(x);
 if(!amount||!contractActive(x,y))return 0;
 return contractBillingPeriod(x)==='monthly'?amount*contractMonthsInYear(x,y):amount
}
function electricityCalc(x){
 const hasStart=x?.meterStart!==''&&x?.meterStart!=null,hasEnd=x?.meterEnd!==''&&x?.meterEnd!=null;
 let consumption=Number(x?.consumption||0);
 if(hasStart&&hasEnd&&Number(x.meterEnd)>=Number(x.meterStart))consumption=Number(x.meterEnd)-Number(x.meterStart);
 const price=x?.pricePerKwh!==''&&x?.pricePerKwh!=null?Number(x.pricePerKwh):null;
 const cost=price!==null?consumption*price:Number(x?.cost||0);
 const meterRent=Number(x?.meterRent||0);
 return {consumption,cost,meterRent,total:cost+meterRent}
}

 p.electricity.filter(x=>Number(x.year)===Number(y)).forEach(x=>d.electricity+=electricityCalc(x).total);
 p.petroleum.filter(x=>x.kind==='purchase'&&(x.date||'').startsWith(String(y))).forEach(x=>d.petroleum+=Number(x.price||0));
 p.gasChecks.filter(x=>(x.date||'').startsWith(String(y))).forEach(x=>d.gas+=Number(x.cost||0));

}

 return `<!doctype html><html><head><meta charset="utf-8"><title>Jahresabschluss ${y}</title><style>body{font-family:Arial,sans-serif;color:#172019;margin:0}main{max-width:900px;margin:auto;padding:28px}h1{margin:0 0 5px}h2{font-size:18px;margin-top:24px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.r{text-align:right;white-space:nowrap}.total td{font-weight:bold;border-top:2px solid #173c29}.btn{background:#173c29;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:bold}.np{margin-bottom:18px}@media print{.np{display:none}@page{size:A4;margin:14mm}main{padding:0}}</style></head><body><main><div class="np"><button class="btn" onclick="window.print()">Drucken / als PDF sichern</button></div><h1>CampManager – Jahresabschluss ${y}</h1><p>${esc(p.site.campName)} · Platz ${esc(p.site.pitch||'–')}</p><h2>Zusammenfassung</h2><table>${Object.entries(d).map(([k,v])=>`<tr><td>${lab[k]}</td><td class="r">${money(v)}</td></tr>`).join('')}<tr class="total"><td>Gesamtkosten</td><td class="r">${money(tot)}</td></tr></table><p><b>Übernachtungen ${y}:</b> ${totalNights(p,y)}</p>${ar?`<h2>Jahresmiete</h2><table><tr><td>Grundbetrag</td><td class="r">${money(ar.baseAmount)}</td></tr><tr><td>Inklusive / genutzt</td><td class="r">${ns.used} / ${ns.included}</td></tr><tr><td>Berechnung Zusatznächte</td><td class="r">${rentAuto(ar)?'automatisch':'manuell'}</td></tr><tr><td>Erwachsenen-Übernachtungen danach</td><td class="r">${num(pn.adult)} × ${money(ar.adultPrice)}</td></tr><tr><td>Kinder-Übernachtungen danach</td><td class="r">${num(pn.child)} × ${money(ar.childPrice)}</td></tr><tr><td>Autos</td><td class="r">${num(ar.carCount)} × ${money(ar.carAnnualPrice)} = ${money(Number(ar.carCount||0)*Number(ar.carAnnualPrice||0))}</td></tr><tr><td>Anhänger</td><td class="r">${num(ar.trailerCount)} × ${money(ar.trailerAnnualPrice)} = ${money(Number(ar.trailerCount||0)*Number(ar.trailerAnnualPrice||0))}</td></tr>${extras.map(e=>`<tr><td>${esc(e.label||'Extra')}</td><td class="r">${num(e.qty||0)} × ${money(e.price)} = ${money(Number(e.qty||0)*Number(e.price||0))}</td></tr>`).join('')}<tr class="total"><td>Berechnete Jahresmiete</td><td class="r">${money(annualRentTotal(ar,p))}</td></tr></table>`:''}<h2>Alle Kostenpositionen</h2><table><tr><th>Datum/Jahr</th><th>Kategorie</th><th>Beschreibung</th><th class="r">Betrag</th></tr>${rows.map(x=>`<tr><td>${esc(x.d)}</td><td>${esc(x.c)}</td><td>${esc(x.t)}</td><td class="r">${money(x.a)}</td></tr>`).join('')}</table></main></body></html>`

/* Dokumente lokal in IndexedDB */
const DB='campmanager_documents_v1', STORE='files';
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbPut(k,b){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(b,k);t.oncomplete=()=>{db.close();res()};t.onerror=()=>rej(t.error)})}
async function dbGet(k){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly'),q=t.objectStore(STORE).get(k);q.onsuccess=()=>{db.close();res(q.result||null)};q.onerror=()=>rej(q.error)})}
async function dbDel(k){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(k);t.oncomplete=()=>{db.close();res()};t.onerror=()=>rej(t.error)})}
async function compress(file,max=1800,q=.82){if(!file.type.startsWith('image/'))return file;const bmp=await createImageBitmap(file);let w=bmp.width,h=bmp.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close();return await new Promise(r=>c.toBlob(r,'image/jpeg',q))||file}

function editor(type,x=null){
 const e=x||{};let title='Eintrag',body='';
 if(type==='shopping'){title='Einkauf';body=field('Artikel','name',e.name,'text','required')+field('Menge','quantity',e.quantity)+area('Notiz','note',e.note)}
 if(type==='cost'){title='Kosten';body=select('Kategorie','category',e.category||'other',[['annual','Jahresgebühr manuell'],['repairs','Reparatur'],['purchases','Neuanschaffung'],['other','Sonstiges']])+field('Jahr','year',e.year||yearNow(),'number','required min="2000"')+field('Betrag €','amount',e.amount,'number','required min="0" step="0.01"')+area('Notiz','note',e.note)}
 if(type==='annualrent'){title='Jahresmiete';body=field('Jahr','year',e.year||yearNow(),'number','required min="2000"')+field('Grundbetrag €','baseAmount',e.baseAmount,'number','required min="0" step="0.01"')+field('Inklusive Übernachtungen','includedNights',e.includedNights||90,'number','required min="0"')+field('Fällig am','dueDate',e.dueDate,'date')+select('Zusatznächte berechnen','autoExtra',e.autoExtra||(rentAuto(e)?'yes':'no'),[['yes','Automatisch aus Aufenthalten'],['no','Manuell']])+field('Erwachsene im Vertrag','adultCount',e.adultCount||0,'number','required min="0" step="1"')+field('Kinder im Vertrag','childCount',e.childCount||0,'number','required min="0" step="1"')+field('Erwachsene € je Übernachtung danach','adultPrice',e.adultPrice,'number','required min="0" step="0.01"')+field('Kinder € je Übernachtung danach','childPrice',e.childPrice,'number','required min="0" step="0.01"')+field('Manuell: Erwachsenen-Übernachtungen','extraAdultNights',e.extraAdultNights||0,'number','min="0"')+field('Manuell: Kinder-Übernachtungen','extraChildNights',e.extraChildNights||0,'number','min="0"')+field('Anzahl Autos','carCount',e.carCount||0,'number','required min="0" step="1"')+field('Jahrespreis pro Auto €','carAnnualPrice',e.carAnnualPrice||0,'number','required min="0" step="0.01"')+field('Anzahl Anhänger','trailerCount',e.trailerCount||0,'number','required min="0" step="1"')+field('Jahrespreis pro Anhänger €','trailerAnnualPrice',e.trailerAnnualPrice||0,'number','required min="0" step="0.01"')+`<div class="rentextras"><b>Weitere Positionen</b><div class="rowsub">Beliebige Jahreskosten hinzufügen, z. B. Schlüssel, Zweitfahrzeug oder Zusatzgebühr.</div><div id="rentExtras">${(Array.isArray(e.extras)?e.extras:[]).map(rentExtraRow).join('')}</div><button type="button" class="btn sec" id="addRentExtra" style="margin-top:8px">＋ Position</button></div>`+area('Notiz','note',e.note)}
 if(type==='petroleum'){title='Petroleum';body=select('Art','kind',e.kind||'purchase',[['purchase','Einkauf'],['usage','Verbrauch'],['stock','Bestand setzen']])+field('Datum','date',e.date||today(),'date','required')+field('Liter','liters',e.liters,'number','required min="0" step="0.1"')+field('Preis gesamt €','price',e.price,'number','min="0" step="0.01"')+area('Notiz','note',e.note)}
 if(type==='electricity'){title='Strom Jahreswert';body=field('Jahr','year',e.year||yearNow(),'number','required min="2000"')+field('Zählerstand Anfang','meterStart',e.meterStart,'number','min="0" step="0.1"')+field('Zählerstand Ende','meterEnd',e.meterEnd,'number','min="0" step="0.1"')+field('Preis pro kWh €','pricePerKwh',e.pricePerKwh,'number','min="0" step="0.0001"')+field('Zählermiete €','meterRent',e.meterRent,'number','min="0" step="0.01"')+field('Verbrauch kWh (alternativ manuell)','consumption',e.consumption,'number','min="0" step="0.1"')+field('Stromkosten € (alternativ manuell)','cost',e.cost,'number','min="0" step="0.01"')}
 if(type==='lawn'||type==='hedge'){title=type==='lawn'?'Rasenschnitt':'Heckenschnitt';body=field('Datum','date',e.date||today(),'date','required')+area('Notiz','note',e.note)}
 if(type==='stay'){title='Aufenthalt';body=field('Anreise','arrival',e.arrival||today(),'date','required')+field('Abreise','departure',e.departure,'date','required')+field('Personen','people',e.people)+area('Notiz','note',e.note)}
 if(type==='conversation'){title='Gespräch';body=field('Datum','date',e.date||today(),'date','required')+field('Uhrzeit','time',e.time||new Date().toTimeString().slice(0,5),'time','required')+field('Gesprächspartner','partner',e.partner,'text','required')+area('Notiz','note',e.note)}
 if(type==='contract'){

function storagePath(path){return String(path||'').split('/').map(encodeURIComponent).join('/')}
async function storageRequest(path,{method='GET',body=null,mime='application/octet-stream',upsert=false}={}){
 if(!cloudReady()||!session?.access_token)throw new Error('Cloud nicht angemeldet');
 const h={apikey:cfg.key,Authorization:'Bearer '+session.access_token};if(body!==null)h['Content-Type']=mime;if(upsert)h['x-upsert']='true';
 const r=await fetch(cloudBase()+'/storage/v1/object/campmanager-documents/'+storagePath(path),{method,headers:h,body});if(!r.ok){const t=await r.text();throw new Error(t||('HTTP '+r.status))}return r
}

async function syncPendingDocuments(){

 for(const p of state.places){for(const d of p.documents){if(d.cloudPath)continue;const b=await dbGet(d.id).catch(()=>null);if(!b)continue;const active=state.activePlaceId;state.activePlaceId=p.id;try{d.cloudPath=await uploadDocumentCloud(d.id,b);count++}catch(e){console.warn(e)}finally{state.activePlaceId=active}}}
 if(count){persist();const id=session?.user?.id;if(id)await api('/rest/v1/camp_states?on_conflict=user_id',{method:'POST',token:session.access_token,prefer:'resolution=merge-duplicates,return=minimal',body:{user_id:id,data:state,updated_at:new Date().toISOString()}}).catch(console.warn);render()}return count
}

function localMonthKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(k){const [y,m]=String(k||'').split('-').map(Number);return y&&m?new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'}):String(k||'')}
function lastDayOfMonth(d=new Date()){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function monthlyBackupDue(){
 const n=new Date(),key=localMonthKey(n),last=localStorage.getItem(MONTH_BACKUP)||'';
 if(last===key)return null;
 const snooze=localStorage.getItem(MONTH_SNOOZE)||'';
 if(snooze===today())return null;
 return n.getDate()>=Math.max(28,lastDayOfMonth(n)-2)?key:null
}
function blobToBase64(blob){return blob.arrayBuffer().then(buf=>{const u=new Uint8Array(buf);let out='';const chunk=0x8000;for(let i=0;i<u.length;i+=chunk)out+=String.fromCharCode(...u.subarray(i,i+chunk));return btoa(out)})}
function base64ToBlob(base64,mime='application/octet-stream'){const bin=atob(base64),chunk=0x8000,parts=[];for(let i=0;i<bin.length;i+=chunk){const end=Math.min(i+chunk,bin.length),u=new Uint8Array(end-i);for(let j=i;j<end;j++)u[j-i]=bin.charCodeAt(j);parts.push(u)}return new Blob(parts,{type:mime})}
async function buildFullBackup(targetMonth=''){
 const files=[],missing=[];
 for(const p of state.places){
  for(const d of p.documents){
   let b=await dbGet(d.id).catch(()=>null);
   if(!b&&d.cloudPath&&cloudReady()&&session?.access_token){try{b=await downloadDocumentCloud(d.cloudPath);if(b)await dbPut(d.id,b)}catch(e){console.warn('Dokument für Backup nicht ladbar',d.id,e)}}
   if(!b){missing.push({id:d.id,title:d.title||d.filename||'Dokument'});continue}
   try{files.push({id:d.id,mime:b.type||d.mime||'application/octet-stream',filename:d.filename||'',base64:await blobToBase64(b)})}catch(e){console.warn('Dokument für Backup nicht lesbar',d.id,e);missing.push({id:d.id,title:d.title||d.filename||'Dokument'})}
  }
 }
 return {format:'CampManagerBackup',formatVersion:1,appVersion:APP_VERSION,createdAt:new Date().toISOString(),month:targetMonth||localMonthKey(),state:JSON.parse(JSON.stringify(state)),files,missingDocuments:missing}
}
async function saveBackupFile(pkg,name){
 const text=JSON.stringify(pkg,null,2),blob=new Blob([text],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
 if(navigator.share&&navigator.canShare?.({files:[file]})){
  try{await navigator.share({files:[file],title:'CampManager Backup',text:'CampManager Sicherungsdatei'});return true}catch(e){if(e?.name!=='AbortError')console.warn(e);if(e?.name==='AbortError')return false}
 }
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return true
}
async function exportFullBackup(targetMonth=localMonthKey(),monthly=false){
 try{
  toast('Backup wird erstellt …');
  const pkg=await buildFullBackup(targetMonth),name=`CampManager-Backup-${targetMonth}-${today()}.campbackup.json`;
  const started=await saveBackupFile(pkg,name);if(!started)return false;
  if(monthly){localStorage.setItem(MONTH_BACKUP,targetMonth);localStorage.removeItem(MONTH_SNOOZE)}
  const miss=pkg.missingDocuments?.length||0;
  toast(miss?`Backup erstellt · ${miss} Dokument(e) nicht verfügbar`:'Backup vollständig erstellt');
  return true
 }catch(e){console.error(e);toast('Backup konnte nicht erstellt werden');return false}
}
async function restoreFullBackupObject(raw){
 const pkg=raw?.format==='CampManagerBackup'&&raw?.state?raw:null;
 const newState=normalize(pkg?pkg.state:raw);
 if(pkg?.files?.length){for(const f of pkg.files){if(!f?.id||!f?.base64)continue;await dbPut(f.id,base64ToBlob(f.base64,f.mime||'application/octet-stream'))}}
 state=newState;persist();render();schedulePush();if(cloudReady()&&session?.access_token)pushCloud().catch(console.warn);
 return {files:pkg?.files?.length||0,missing:pkg?.missingDocuments?.length||0}
}
async function restoreBackupFile(file){
 const raw=JSON.parse(await file.text());
 if(!raw||typeof raw!=='object')throw new Error('invalid');
 if(!confirm('Dieses Backup wiederherstellen? Die aktuellen App-Daten werden durch den Sicherungsstand ersetzt.'))return false;
 const r=await restoreFullBackupObject(raw);closeModal();toast(r.missing?`Backup wiederhergestellt · ${r.missing} Dokument(e) fehlten bereits im Backup`:'Backup vollständig wiederhergestellt');return true
}
function monthlyBackupPrompt(){
 const key=monthlyBackupDue();if(!key)return;
 modal(`Monatsbackup · ${monthLabel(key)}`,`<div class="notice good"><b>Monatsende:</b> Möchtest du jetzt eine Sicherungsdatei erstellen?</div><p>Die Datei enthält deine CampManager-Daten und die verfügbaren gescannten Dokumente. Auf iPhone/iPad kannst du sie über das Teilen-Menü direkt in der <b>Dateien-App</b> sichern.</p><p class="rowsub">Beim späteren Einspielen werden Stellplätze, Kosten, Jahresmieten, Übernachtungen, Strom, Petroleum, Fristen, Verträge, Gespräche und Dokumente wieder an ihren ursprünglichen Stellen hergestellt.</p>`,`<button class="btn sec" type="button" id="monthBackupLater">Später</button><button class="btn" type="button" id="monthBackupNow">Backup erstellen</button>`)
 $('#monthBackupLater').onclick=()=>{localStorage.setItem(MONTH_SNOOZE,today());closeModal()};
 $('#monthBackupNow').onclick=async()=>{const ok=await exportFullBackup(key,true);if(ok)closeModal()}
}

function settings(){
 modal('Einstellungen',`<h3>Cloud-Sync</h3><form id="cfgForm"><div class="formgrid">${field('Supabase Project URL','url',cfg.url||'','url')}${field('Publishable / Anon Key','key',cfg.key||'')}</div></form><div class="toolbar"><button class="btn sec" id="saveCfg">Cloud-Daten speichern</button><button class="btn sec" id="showSql">SQL anzeigen</button></div>${cloudReady()&&!session?.access_token?`<form id="authForm"><div class="formgrid">${field('Familien-E-Mail','email','','email','required')}${field('Passwort','password','','password','required minlength="6"')}</div></form><div class="toolbar"><button class="btn" id="login">Anmelden</button><button class="btn sec" id="signup">Konto erstellen</button></div>`:''}${session?.access_token?`<div class="notice good">Cloud angemeldet · Daten und Dokumente können zwischen Geräten synchronisiert werden.</div><div class="toolbar"><button class="btn" id="pull">Cloud laden</button><button class="btn" id="push">Cloud speichern</button><button class="btn sec" id="syncDocs">Dokumente synchronisieren</button><button class="btn sec" id="logout">Abmelden</button></div><h3>Automatische Sicherung</h3><div class="toolbar"><button class="btn sec" id="backupNow">Cloud-Backup jetzt</button><button class="btn sec" id="backupCloudList">Cloud-Backups</button></div><div class="notice">Bei aktiver Cloud wird höchstens einmal pro Tag automatisch eine Datensicherung angelegt.</div>`:''}<div class="divider"></div><h3>Monatsbackup als Datei</h3><div class="toolbar"><button class="btn sec" id="backupOut">Backup-Datei erstellen</button><label class="btn sec">Backup wiederherstellen<input id="backupIn" type="file" accept=".json,.campbackup,application/json" hidden></label></div><div class="notice">Die Sicherungsdatei enthält alle CampManager-Daten und – soweit verfügbar – auch die gescannten Dokumentdateien. Am Monatsende fragt die App automatisch nach einem Monatsbackup.</div><div class="rowsub">Letztes Monatsbackup: ${localStorage.getItem(MONTH_BACKUP)?esc(monthLabel(localStorage.getItem(MONTH_BACKUP))):'noch keines'}</div><div class="divider"></div><h3>Installation</h3><div class="notice">Als App auf dem Startbildschirm nutzbar. Auf iPhone/iPad: in Safari „Teilen“ → „Zum Home-Bildschirm“.</div><div class="toolbar">${installPrompt?'<button class="btn" id="installApp">App installieren</button>':''}</div><h3>App-Version</h3><div class="notice">CampManager v${APP_VERSION} · PWA-Updateprüfung aktiv</div><div class="toolbar"><button class="btn sec" id="checkUpdate">Jetzt nach Update suchen</button></div>`,`<button class="btn sec" type="button" data-close>Schließen</button>`);
 $('#saveCfg').onclick=()=>{const d=Object.fromEntries(new FormData($('#cfgForm')).entries());cfg={url:String(d.url||'').trim().replace(/\/+$/,''),key:String(d.key||'').trim()};localStorage.setItem(CFG,JSON.stringify(cfg));toast('Cloud-Daten gespeichert');closeModal();settings()};
 $('#showSql').onclick=()=>modal('Supabase SQL',`<pre style="white-space:pre-wrap;background:#132019;color:#e8efe9;padding:10px;border-radius:12px;font-size:11px">${esc(SQL)}</pre>`,`<button class="btn sec" type="button" data-close>Schließen</button>`);
 if($('#login'))$('#login').onclick=async()=>{const d=Object.fromEntries(new FormData($('#authForm')).entries());try{await login(d.email,d.password);await pullCloud();await dailyCloudBackup(false).catch(()=>{});await syncPendingDocuments().catch(()=>{});closeModal();toast('Angemeldet')}catch(e){console.warn(e);toast('Anmeldung fehlgeschlagen')}};
 if($('#signup'))$('#signup').onclick=async()=>{const d=Object.fromEntries(new FormData($('#authForm')).entries());try{const s=await signup(d.email,d.password);toast(s?.access_token?'Konto erstellt':'Bitte E-Mail bestätigen')}catch(e){console.warn(e);toast('Konto konnte nicht erstellt werden')}};
 if($('#pull'))$('#pull').onclick=()=>pullCloud();if($('#push'))$('#push').onclick=()=>pushCloud();if($('#syncDocs'))$('#syncDocs').onclick=async()=>toast((await syncPendingDocuments())+' Dokument(e) hochgeladen');
 if($('#backupNow'))$('#backupNow').onclick=async()=>{try{await dailyCloudBackup(true);toast('Cloud-Backup erstellt')}catch(e){console.warn(e);toast('Cloud-Backup fehlgeschlagen')}};
 if($('#backupCloudList'))$('#backupCloudList').onclick=()=>cloudBackupManager();
 if($('#installApp'))$('#installApp').onclick=()=>installApp();
 if($('#checkUpdate'))$('#checkUpdate').onclick=async()=>{const newer=await checkForUpdate(true);toast(newer?'Update verfügbar':'App ist aktuell')};
 if($('#logout'))$('#logout').onclick=()=>{session=null;localStorage.removeItem(SES);closeModal();render();toast('Abgemeldet')};
 $('#backupOut').onclick=()=>exportFullBackup(localMonthKey(),false);
 $('#backupIn').onchange=async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{await restoreBackupFile(f)}catch(e){console.warn(e);toast('Ungültige oder beschädigte Backup-Datei')}}
}
function downloadBackup(data,name){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}


document.addEventListener('submit',e=>{
 const f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();if(!f.reportValidity())return;
 if(f.id==='editForm'){saveEditor(f);return}
 if(f.id==='placeForm'){savePlace(f);return}
 if(f.id==='docForm'){const d=Object.fromEntries(new FormData(f).entries()),id=f.dataset.id;let x=place().documents.find(x=>x.id===id);if(!x){x={...(pendingDocs.get(id)||{}),id,createdAt:new Date().toISOString()};place().documents.push(x)}Object.assign(x,d);pendingDocs.delete(id);closeModal();save();toast('Dokument gespeichert');return}
});
document.addEventListener('click',e=>{
 if(e.target.closest('[data-close]')){closeModal();return}
 const n=e.target.closest('[data-view]');if(n){show(n.dataset.view);return}
 const g=e.target.closest('[data-go]');if(g){const v=g.dataset.go;if(g.dataset.jump)tab[v]=g.dataset.jump;render();show(v);return}
 const tj=e.target.closest('[data-tabsec]');if(tj){tab[tj.dataset.tabsec]=tj.dataset.tab;render();show(tj.dataset.tabsec);return}
 const cj=e.target.closest('[data-costjump]');if(cj){tab.costs=cj.dataset.costjump;renderCosts();show('costs');return}
 const a=e.target.closest('[data-add]');if(a){editor(a.dataset.add);return}
 const ed=e.target.closest('[data-edit]');if(ed){editItem(ed.dataset.edit,ed.dataset.id);return}
 const de=e.target.closest('[data-del]');if(de){deleteItem(de.dataset.del,de.dataset.id);return}
 const ps=e.target.closest('[data-placeswitch]');if(ps){switchPlace(ps.dataset.placeswitch);return}
 const pe=e.target.closest('[data-placeedit]');if(pe){closeModal();placeEditor(pe.dataset.placeedit);return}
 if(e.target.closest('[data-placeadd]')){closeModal();placeEditor();return}
 const pd=e.target.closest('[data-placedel]');if(pd){deletePlace(pd.dataset.placedel);return}
 if(e.target.closest('[data-docscan]')){$('#camInput')?.click();return}
 if(e.target.closest('[data-docupload]')){$('#fileInput')?.click();return}
 const dop=e.target.closest('[data-docopen]');if(dop){openDoc(dop.dataset.docopen);return}
 const ded=e.target.closest('[data-docedit]');if(ded){const x=place().documents.find(x=>x.id===ded.dataset.docedit);if(x)docEditor(x,false);return}
 const ddl=e.target.closest('[data-docdel]');if(ddl){delDoc(ddl.dataset.docdel);return}
 const rx=e.target.closest('[data-rentextra-del]');if(rx){rx.closest('[data-rentextra]')?.remove();return}
 const br=e.target.closest('[data-backuprestore]');if(br){if(!confirm('Diesen Sicherungsstand wiederherstellen?'))return;getCloudBackup(br.dataset.backuprestore).then(x=>{if(x?.data){state=normalize(x.data);persist();render();closeModal();toast('Backup wiederhergestellt')}}).catch(()=>toast('Wiederherstellung fehlgeschlagen'));return}
 const bd=e.target.closest('[data-backupdownload]');if(bd){getCloudBackup(bd.dataset.backupdownload).then(x=>x?.data&&downloadBackup(x.data,'campmanager-cloud-backup-'+bd.dataset.backupdownload+'.json')).catch(()=>toast('Download fehlgeschlagen'));return}
 if(e.target.id==='syncDocsBtn'){syncPendingDocuments().then(n=>toast(n+' Dokument(e) hochgeladen')).catch(()=>toast('Synchronisierung fehlgeschlagen'));return}
 if(e.target.id==='updateBtn'){applyUpdate();return}
 if(e.target.id==='pdfBtn'){openPdf();return}
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-check]')){const x=place().shopping.find(x=>x.id===e.target.dataset.check);if(x){x.done=e.target.checked;save()}return}
 if(e.target.id==='closeYear'){closingYear=Number(e.target.value)||yearNow();renderCosts();show('costs');return}
 if(e.target.id==='camInput'||e.target.id==='fileInput'){const f=e.target.files?.[0];e.target.value='';if(f)handleDoc(f);return}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
$('#homeBtn').onclick=()=>show('dashboard');
$('#placeBtn').onclick=switcher;
$('#settingsBtn').onclick=settings;
$('#logoImg').onerror=()=>{const x=$('#logoImg');if(!x.dataset.fallback){x.dataset.fallback='1';x.src='logo-fallback.jpg'}else x.style.display='none'};

let swReg=null,updateReloading=false,installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
async function installApp(){if(!installPrompt){toast('Auf iPhone/iPad über Teilen → Zum Home-Bildschirm installieren');return}try{await installPrompt.prompt();await installPrompt.userChoice}catch(e){console.warn(e)}installPrompt=null;closeModal()}
function showUpdate(){const b=$('#updateBanner');if(b)b.classList.remove('hidden')}
async function checkForUpdate(manual=false){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return false;const v=await r.json();if(Number(v.version)>APP_VERSION){showUpdate();return true}if(swReg)await swReg.update();return !!swReg?.waiting}catch(e){if(manual)console.warn(e);return false}}
async function registerPWA(){
 if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
 try{swReg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});if(swReg.waiting)showUpdate();swReg.addEventListener('updatefound',()=>{const w=swReg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updateReloading)return;updateReloading=true;location.reload()})}catch(e){console.warn('Service Worker',e)}
}
async function applyUpdate(){try{if(swReg)await swReg.update();if(swReg?.waiting){swReg.waiting.postMessage({type:'SKIP_WAITING'});return}location.replace(location.pathname+'?v='+Date.now())}catch{location.reload()}}
(async()=>{render();await registerPWA();setTimeout(()=>checkForUpdate(false),1200);if(cloudReady()&&session?.access_token){await pullCloud();dailyCloudBackup(false).catch(console.warn);syncPendingDocuments().catch(console.warn)}setTimeout(monthlyBackupPrompt,1800)})();
})();
</script>
</body>
</html>
