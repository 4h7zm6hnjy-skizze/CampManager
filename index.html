<title>CampManager v51</title>
<style>
:root{
 --bg:#f5f2ea;--card:#fff;--ink:#142019;--muted:#6d766e;--line:#ddd7ca;
 --green:#173c29;--green2:#2e6548;--soft:#edf3ef;--danger:#a43e32;--gold:#c78b38;
 --shadow:0 10px 28px rgba(21,38,27,.08);--radius:20px;--safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;min-width:0}
button{cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.masthead{padding:12px 12px 0;background:var(--bg)}.masthead img{display:block;width:100%;height:auto;max-height:190px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:24px;padding:10px;box-shadow:var(--shadow)}.top{position:sticky;top:0;z-index:40;display:flex;flex-direction:column;gap:6px;padding:8px 12px;background:rgba(250,248,243,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.toprow,.subrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}.subrow{min-width:0}.topname{font-size:13px;color:var(--muted);font-weight:700;min-width:0;flex:1;white-space:normal;overflow-wrap:anywhere;line-height:1.2}
.brand{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:0;color:inherit;text-align:left;min-width:0}
.brand.brandtextonly{gap:0}
.logo{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line)}
.brandcopy{min-width:0;display:flex;flex-direction:column;line-height:1.08}.brandcopy b{font-size:16px;white-space:nowrap}.copyright{font-size:9px;color:var(--muted);font-weight:650;margin-top:3px;white-space:nowrap}
.ver{font-size:10px;background:var(--green);color:#fff;padding:2px 6px;border-radius:999px;vertical-align:2px}
.topright{display:flex;align-items:center;gap:6px}
.placebtn,.status{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-weight:800;font-size:12px;color:var(--ink)}
.placebtn{display:flex;align-items:center;gap:6px}
.placebtn img{width:23px;height:23px;border-radius:7px;object-fit:cover}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px}
main{max-width:1100px;margin:auto;padding:16px 14px calc(94px + var(--safe))}
.view{display:none}.view.active{display:block}
.hero{background:linear-gradient(135deg,#173c29,#10261a);color:#fff;border-radius:26px;padding:18px;display:grid;grid-template-columns:1fr;gap:14px;align-items:center;box-shadow:var(--shadow)}
.hero-banner{background:#fff;border:1px solid var(--line);border-radius:24px;padding:10px;box-shadow:var(--shadow);margin-bottom:14px}
.hero-banner .hero-logo,.hero-banner .hero-title{display:block;width:100%;border-radius:18px;background:#fff}
.hero-banner .hero-logo{height:auto;max-height:420px;object-fit:contain}
.hero-banner .hero-title{height:auto;max-height:420px;object-fit:contain}
.hero h1{margin:6px 0;font-size:28px}.hero p{margin:0;color:#dce7df}
.hero-media{position:relative;width:100%;background:#fff;border-radius:18px;overflow:hidden;min-width:0;order:-1}
.hero-media .hero-logo{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;background:#fff;border-radius:18px;padding:6px 4px 0}
.hero-media .hero-title{display:block;width:100%;height:320px;object-fit:cover;background:#fff;border-radius:18px}
.badge{display:inline-flex;border-radius:999px;padding:4px 8px;background:#edf3ef;color:#2b5c3f;font-size:12px;font-weight:800}.hero .badge{background:rgba(255,255,255,.13);color:#fff}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:12px}
.card{grid-column:span 4;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.card.half{grid-column:span 6}.card.full{grid-column:1/-1}
.card h2,.card h3{margin:0 0 7px}.card h2{font-size:18px}.card h3{font-size:15px}.card p{margin:3px 0;color:var(--muted)}
.cardaction{border:1px solid var(--line);text-align:left;color:inherit}
.metric{font-size:28px;font-weight:850;letter-spacing:-.03em}.metric small{font-size:12px;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:13px}.head h1{margin:0;font-size:25px}.head p{margin:3px 0 0;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 13px}
.btn{border:0;background:var(--green);color:#fff;font-weight:800;padding:10px 13px;border-radius:12px}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.btn.block{width:100%}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs.manage-tabs{overflow:visible;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 0 12px}
.tabs.manage-tabs .chip{width:100%;min-height:44px;white-space:normal;text-align:center;line-height:1.15;padding:9px 7px}
.tabs.cost-tabs{overflow:visible;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:2px 0 12px}
.tabs.cost-tabs .chip{width:100%;min-height:44px;white-space:normal;text-align:center;line-height:1.12;padding:8px 6px;border-radius:13px;font-size:12.5px}
.tabs.cost-tabs .chip:last-child:nth-child(odd){grid-column:1/-1}

.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;font-size:13px;color:var(--ink)}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:15px;background:#fff;border:1px solid var(--line)}
.rowmain{flex:1;min-width:0}.rowtitle{font-weight:800;overflow-wrap:anywhere}.rowsub{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.rowactions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px}.mini.danger{color:var(--danger)}
.empty{padding:25px 14px;text-align:center;border:1px dashed #cfc6b8;border-radius:16px;color:var(--muted);background:rgba(255,255,255,.45)}
.notice{padding:11px;border:1px solid #dfd6bf;border-radius:14px;background:#f9f4e8;margin:10px 0}.notice.good{background:#eaf4ed;border-color:#cfe2d5}.notice.warn{background:#fff1da;border-color:#ecd8af}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}
.field input,.field select,.field textarea{width:100%;font-size:16px;line-height:1.2;border:1px solid #d9d2c5;background:#fff;border-radius:11px;padding:10px;color:var(--ink);outline:none}.field textarea{min-height:74px;resize:vertical}
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:8px;background:rgba(9,20,14,.58);backdrop-filter:blur(4px)}
.modalcard{width:min(100%,620px);max-height:calc(100dvh - 16px);overflow-y:auto;overflow-x:hidden;background:#faf8f3;border-radius:22px;border:1px solid var(--line);padding:12px;box-shadow:0 30px 90px rgba(0,0,0,.28)}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-12px;background:#faf8f3;padding:3px 0 8px;z-index:2}.modalhead h2{margin:0;font-size:23px}
.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:-12px;background:#faf8f3;padding:8px 0 2px;margin-top:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + var(--safe));background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav{border:0;background:transparent;border-radius:12px;padding:6px 3px;color:#6c756d;display:flex;flex-direction:column;align-items:center;gap:2px}.nav span{font-size:19px}.nav small{font-size:10px;font-weight:800}.nav.active{background:#edf3ef;color:var(--green)}
.toast{position:fixed;left:50%;bottom:86px;z-index:120;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#102319;color:#fff;padding:10px 14px;border-radius:999px;font-weight:750;transition:.2s;max-width:calc(100vw - 24px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}.quick b{display:block;font-size:20px}.quick small{color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:13px;object-fit:cover;background:#f2efe7;border:1px solid var(--line);flex:0 0 44px}.avatar.ph{display:grid;place-items:center;font-size:20px}
.photoPreview{width:88px;height:88px;border-radius:16px;object-fit:cover;background:#eee;border:1px solid var(--line)}
.memberselect{grid-column:1/-1;display:grid;gap:8px}.memberselect-title{font-size:12px;font-weight:800}.membergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.membercheck{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:750;min-width:0}.membercheck input{width:20px;height:20px;flex:0 0 auto}.membercheck span{min-width:0;overflow-wrap:anywhere}.membercheck small{display:block;color:var(--muted);font-weight:600;margin-top:2px}.membertag{display:inline-flex;padding:3px 7px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:750;color:var(--green)}
.costline{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:13px}.bar{height:8px;background:#eee8dd;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold))}.right{text-align:right}.coststack{display:grid;gap:12px}.costdetail{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}.costdetail-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.costdetail-title{font-weight:800;font-size:18px;line-height:1.2}.costdetail-value{font-weight:900;font-size:18px;white-space:nowrap}.costdetail .rowsub{margin-top:4px}.costmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.costpill{background:#f3f0e8;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.doc{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px}.docthumb{width:100%;aspect-ratio:4/3;border-radius:11px;background:#f1eee7;display:grid;place-items:center;font-size:36px;overflow:hidden}.docthumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.conversation{white-space:pre-wrap;line-height:1.42;margin-top:6px}
.divider{height:1px;background:var(--line);margin:14px 0}

/* Jahresabschluss - direkt in der App, damit iPhone/PWA nicht durch Pop-ups blockiert */
body.report-open{overflow:hidden}
.report-overlay{position:fixed;inset:0;z-index:300;background:#fff;color:#172019;overflow:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.report-toolbar{position:sticky;top:0;z-index:4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:rgba(255,255,255,.97);border-bottom:1px solid #ddd;backdrop-filter:blur(12px)}
.report-toolbar .btn{min-height:42px}
.report-toolbar .report-back{margin-right:auto}
.report-content{max-width:900px;margin:auto;padding:22px 14px calc(70px + env(safe-area-inset-bottom,0px))}
.report-content h1{font-size:28px;line-height:1.12;margin:0 0 6px;overflow-wrap:anywhere}
.report-content h2{font-size:20px;margin:26px 0 10px}
.report-content p{line-height:1.4}
.report-content table{width:100%;border-collapse:collapse;font-size:14px}
.report-content th,.report-content td{padding:9px 8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
.report-content .r{text-align:right;white-space:nowrap}
.report-content .total td{font-weight:850;border-top:2px solid #173c29}
.report-help{font-size:12px;color:#68716b;margin:8px 0 16px}
@media(max-width:600px){
 .report-content h1{font-size:24px}
 .report-content{padding-left:10px;padding-right:10px}
 .report-content table{font-size:12px}
 .report-content th,.report-content td{padding:8px 6px}
 .report-toolbar .btn{flex:1 1 auto;padding:10px 9px;font-size:13px}
 .report-toolbar .report-back{flex:0 0 auto}
}
@media print{
 @page{size:A4;margin:13mm}
 html,body{background:#fff!important;overflow:visible!important}
 body>*:not(#reportOverlay){display:none!important}
 #reportOverlay{display:block!important;position:static!important;inset:auto!important;overflow:visible!important;padding:0!important;background:#fff!important}
 #reportOverlay.hidden{display:none!important}
 .report-toolbar,.report-help{display:none!important}
 .report-content{max-width:none!important;margin:0!important;padding:0!important}
 .report-content h1{font-size:22pt}
 .report-content h2{font-size:15pt;break-after:avoid}
 .report-content table{font-size:9.5pt}
 .report-content tr{break-inside:avoid}
}

.updatebanner{position:sticky;top:82px;z-index:39;margin:8px auto 0;max-width:1100px;padding:10px 14px;background:#fff1da;border:1px solid #e4c982;border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px}
.progress{height:10px;background:#e9e5dc;border-radius:999px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold));border-radius:999px}
.kpirow{display:flex;justify-content:space-between;gap:10px;align-items:center}.kpirow strong{font-size:20px}
.comparetable{width:100%;border-collapse:collapse;font-size:13px}.comparetable th,.comparetable td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right}.comparetable th:first-child,.comparetable td:first-child{text-align:left}.delta.up{color:var(--danger)}.delta.down{color:var(--green2)}
.deadline-overdue{color:var(--danger);font-weight:800}.deadline-done{color:var(--green2);font-weight:800}.deadline-cancelled{color:var(--muted);font-weight:800}.deadline-status{display:inline-flex;align-items:center;font-size:10px;font-weight:900;padding:3px 7px;border-radius:999px;margin-left:5px}.deadline-status.paid{background:#e7f4eb;color:#23643d}.deadline-status.cancelled{background:#eeeae4;color:#6d665d}.cloudtag{display:inline-flex;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;background:var(--soft);color:var(--green2);margin-left:5px}
.rentextras{grid-column:1/-1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px}.rentextra{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:7px;align-items:end;margin-top:8px}.rentextra .field{margin:0}
.renttiers{grid-column:1/-1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px}.renttiers h3{margin:0 0 7px;font-size:15px}.tiergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tierbox{border:1px solid var(--line);border-radius:12px;padding:9px;background:#faf9f5}.tierbox b{display:block;font-size:12px;margin-bottom:5px}.tierbox .field{margin:0}.tierline{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}.tierline:last-child{border-bottom:0}.agebadge{display:inline-flex;padding:3px 7px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:800}.agewarn{color:#9a5b00;font-weight:800}
@media(max-width:600px){.rentextra{grid-template-columns:1fr 1fr}.rentextra .field:first-child{grid-column:1/-1}.rentextra button{align-self:end}.tiergrid{grid-template-columns:1fr}.updatebanner{top:78px;margin-left:8px;margin-right:8px}}
@media(max-width:760px){
 .head{margin-bottom:10px}
 .head h1{font-size:24px;line-height:1.1}
 .head p{font-size:14px;line-height:1.25}
 .tabs.manage-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tabs.manage-tabs .chip{font-size:13px;border-radius:13px}

 .hero{grid-template-columns:1fr}.hero-banner .hero-logo{max-height:260px}.hero-banner .hero-title{height:auto;max-height:260px}.card,.card.half{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick{grid-template-columns:repeat(2,1fr)}.docgrid{grid-template-columns:1fr}.costline{grid-template-columns:115px 1fr 75px}.costdetail-top{flex-direction:column;align-items:flex-start}.costdetail-value{font-size:22px}.top{padding-left:10px;padding-right:10px}.topname{font-size:12px}.placebtn,.status{font-size:11px;padding:6px 8px}.membergrid{grid-template-columns:1fr}.logo{width:44px;height:44px}
}

@media(min-width:761px){

}

 .tabs.cost-tabs .chip:last-child:nth-child(odd){grid-column:auto}
}

</style>

<script>
(()=>{'use strict';

function stayDatesForYear(p=place(),y=yearNow()){
 const startYear=`${y}-01-01`,endYear=`${Number(y)+1}-01-01`,set=new Set();
 for(const x of p.stays||[]){
  if(!x.arrival||!x.departure)continue;
  const a=x.arrival<startYear?startYear:x.arrival,b=x.departure>endYear?endYear:x.departure;
  if(b<=a)continue;
  for(let d=dparse(a),end=dparse(b);d&&end&&d<end;d.setDate(d.getDate()+1))set.add(d.toISOString().slice(0,10))
 }

}
function ageOnDate(birthDate,dateStr){
 if(!birthDate||!dateStr)return null;
 const b=dparse(birthDate),d=dparse(dateStr);if(!b||!d||b>d)return null;
 let age=d.getFullYear()-b.getFullYear();
 if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))age--;
 return age
}
function personTariffOnDate(person,dateStr){

}

function personStayDatesForYear(p,personId,y){

  if(!st.arrival||!st.departure)continue;
  const a=st.arrival<startYear?startYear:st.arrival,b=st.departure>endYear?endYear:st.departure;
  if(b<=a)continue;
  const ids=staySelectedFamilyIds(st);
  const selected=ids?ids.includes(String(personId)):true;
  if(!ids)legacy.push(st.id);
  if(!selected)continue;
  for(let d=dparse(a),end=dparse(b);d&&end&&d<end;d.setDate(d.getDate()+1))set.add(d.toISOString().slice(0,10))
 }

}
function tieredRentBreakdown(p,x){

 let adultCost=0,childCost=0;
 for(const person of state.family||[]){
  if(!person?.birthDate){missing.add(person?.name||'Unbenannte Person');continue}
  const ps=personStayDatesForYear(p,person.id,y);ps.legacy.forEach(id=>legacyStayIds.add(id));
  let adultNights=0,childNights=0,freeNights=0;
  for(const date of ps.dates){
   const kind=personTariffOnDate(person,date);
   if(kind==='adult')adultNights++;
   else if(kind==='child')childNights++;
   else if(kind==='free')freeNights++;
  }
  const ai=tierIndexByStayNumber(adultNights),ci=tierIndexByStayNumber(childNights);
  if(ai>=0){adult[ai]++;adultCost+=Number(adultRates[ai]||0)}
  if(ci>=0){child[ci]++;childCost+=Number(childRates[ci]||0)}
  if(freeNights>0){const fi=tierIndexByStayNumber(freeNights);if(fi>=0)free[fi]++}
  personDetails.push({id:person.id,name:person.name||'Person',adultNights,childNights,freeNights,adultTier:ai,childTier:ci,totalNights:ps.dates.length});
 }
 const used=dates.length,tierDays=tierDaysForCount(used),carCount=Math.max(0,Number(x?.carCount||0)),carTier=[0,0,0];
 const carIndex=tierIndexByStayNumber(used);if(carIndex>=0&&carCount>0)carTier[carIndex]=carCount;
 const carCost=carIndex>=0?carCount*Number(carRates[carIndex]||0):0;
 const trailerCost=Number(x?.trailerCount||0)*Number(x?.trailerAnnualPrice||0),extrasCost=rentExtraTotal(x);
 return {year:y,used,tierDays,adult,child,free,missing:[...missing],legacyStayIds:[...legacyStayIds],personDetails,adultRates,childRates,carRates,carCount,carTier,carTierNights:carTier,adultCost,childCost,carCost,trailerCost,extrasCost,total:Number(x?.baseAmount||0)+adultCost+childCost+carCost+trailerCost+extrasCost}
}
function legacyRentAuto(x){return x?.autoExtra?x.autoExtra==='yes':!(Number(x?.extraAdultNights||0)||Number(x?.extraChildNights||0))}

}

function annualRentFor(p,y){return p.annualRent.find(x=>Number(x.year)===Number(y))||null}
function contractActive(x,y){

 return !(x.startDate&&x.startDate>b)&&!(x.endDate&&x.endDate<a)
}
function contractBaseAmount(x){return Number(x.costAmount ?? x.annualCost ?? 0)}
function contractBillingPeriod(x){return x.billingPeriod||'yearly'}
function contractType(x){return x?.contractType||'general'}
function contractTypeLabel(x){return contractType(x)==='mobile'?'Handyvertrag':contractType(x)==='internet'?'Internetvertrag':contractType(x)==='camping'?'Campingvertrag':'Vertrag'}
function contractMonthsInYear(x,y){
 if(!contractActive(x,y))return 0;
 let startMonth=1,endMonth=12;
 if(x.startDate&&Number(x.startDate.slice(0,4))===Number(y))startMonth=Number(x.startDate.slice(5,7))||1;
 if(x.endDate&&Number(x.endDate.slice(0,4))===Number(y))endMonth=Number(x.endDate.slice(5,7))||12;
 return Math.max(0,endMonth-startMonth+1)
}
function contractCostForYear(x,y){

}
function electricityCalc(x){
 const hasStart=x?.meterStart!==''&&x?.meterStart!=null,hasEnd=x?.meterEnd!==''&&x?.meterEnd!=null;
 let consumption=Number(x?.consumption||0);
 if(hasStart&&hasEnd&&Number(x.meterEnd)>=Number(x.meterStart))consumption=Number(x.meterEnd)-Number(x.meterStart);
 const price=x?.pricePerKwh!==''&&x?.pricePerKwh!=null?Number(x.pricePerKwh):null;
 const cost=price!==null?consumption*price:Number(x?.cost||0);
 // Ab v40 wird die Zählermiete als Monatsbetrag gespeichert. Alte Datensätze enthielten einen Jahresbetrag.
 const hasMonthly=x?.meterRentMonthly!==''&&x?.meterRentMonthly!=null;
 const meterRentMonthly=hasMonthly?Number(x.meterRentMonthly||0):Number(x?.meterRent||0)/12;
 const meterRentAnnual=meterRentMonthly*12;
 return {consumption,cost,meterRentMonthly,meterRentAnnual,meterRent:meterRentAnnual,total:cost+meterRentAnnual}
}

function travelCalc(x){
 const km=Math.max(0,Number(x?.km||0)),consumption=Math.max(0,Number(x?.consumption||0)),literPrice=Math.max(0,Number(x?.literPrice||0));
 const liters=km*consumption/100,cost=liters*literPrice,durationMinutes=Math.max(0,Number(x?.durationMinutes||0));

}

function costData(p,y){
 const d={annual:0,deposit:0,insurance:0,repairs:0,purchases:0,other:0,electricity:0,travel:0,petroleum:0,gasBottles:0,gas:0,contracts:0};
 const r=annualRentFor(p,y);if(r)d.annual+=annualRentTotal(r,p);
 if(p.deposit?.date&&String(p.deposit.date).startsWith(String(y)))d.deposit+=Number(p.deposit.amount||0);
 d.insurance+=insuranceAnnualCost(p,y);
 p.costs.filter(x=>Number(x.year)===Number(y)).forEach(x=>{const k=x.category||'other';d[k]=(d[k]||0)+Number(x.amount||0)});
 p.electricity.filter(x=>Number(x.year)===Number(y)).forEach(x=>d.electricity+=electricityCalc(x).total);
 (p.travelCosts||[]).filter(x=>x.date&&(x.date||'').startsWith(String(y))).forEach(x=>d.travel+=travelCalc(x).cost);
 p.petroleum.filter(x=>x.kind==='purchase'&&(x.date||'').startsWith(String(y))).forEach(x=>d.petroleum+=Number(x.price||0));
 p.gasBottles.filter(x=>x.kind==='purchase'&&(x.date||'').startsWith(String(y))).forEach(x=>d.gasBottles+=Number(x.price||0));
 p.gasChecks.filter(x=>(x.date||'').startsWith(String(y))).forEach(x=>d.gas+=Number(x.cost||0));

/* Kleiner integrierter PDF-Generator: keine externe Bibliothek/API nötig */
function pdfWinAnsi(s){
 const special={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159,'×':215};
 let out='';
 for(const ch of String(s??'')){
  let code=special[ch]??ch.charCodeAt(0);
  if(code>255)code=63;
  if(code===40||code===41||code===92)out+='\\'+String.fromCharCode(code);
  else if(code<32||code>126)out+='\\'+code.toString(8).padStart(3,'0');
  else out+=String.fromCharCode(code)
 }
 return out
}
function pdfWrap(text,max=88){
 const words=String(text??'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean),lines=[];let cur='';
 for(const w of words){if(!cur)cur=w;else if((cur+' '+w).length<=max)cur+=' '+w;else{lines.push(cur);cur=w}}
 if(cur)lines.push(cur);return lines.length?lines:['']
}
function buildAnnualPdfBlob(p,y){
 const W=595.28,H=841.89,M=42,R=W-M,B=46,TOP=800;
 const pages=[[]];let yy=TOP;
 const page=()=>pages[pages.length-1];
 const cmd=x=>page().push(x);
 const newPage=()=>{pages.push([]);yy=TOP};
 const ensure=h=>{if(yy-h<B)newPage()};
 const width=(t,size)=>String(t??'').length*size*.49;
 const text=(t,x,yPos,size=10,bold=false,right=false)=>{
  const str=String(t??'');let xx=right?Math.max(M,R-width(str,size)):x;
  cmd(`BT /${bold?'F2':'F1'} ${size} Tf 0 0 0 rg 1 0 0 1 ${xx.toFixed(2)} ${yPos.toFixed(2)} Tm (${pdfWinAnsi(str)}) Tj ET`)
 };
 const line=(yPos,x1=M,x2=R)=>cmd(`0.80 G 0.55 w ${x1.toFixed(2)} ${yPos.toFixed(2)} m ${x2.toFixed(2)} ${yPos.toFixed(2)} l S`);
 const heading=t=>{ensure(34);yy-=5;text(t,M,yy,15,true);yy-=17};
 const row=(l,v,bold=false)=>{ensure(22);text(l,M,yy,10,bold);text(v,R,yy,10,bold,true);yy-=11;line(yy);yy-=9};
 const paragraph=(t,size=9)=>{for(const ln of pdfWrap(t,94)){ensure(14);text(ln,M,yy,size);yy-=12}yy-=3};

 text(`CampManager - Jahresabschluss ${y}`,M,yy,21,true);yy-=27;
 text(`${p.site.campName||'Campingplatz'} - Platz ${p.site.pitch||'-'}`,M,yy,11);yy-=28;

 const d=costData(p,y),tot=Object.values(d).reduce((a,b)=>a+b,0);
 const lab={annual:'Jahresmiete / Platz',deposit:'Kaution (einmalig)',insurance:'Versicherung',repairs:'Reparaturen',purchases:'Neuanschaffungen',other:'Sonstiges',electricity:'Strom + Zählermiete',petroleum:'Petroleum',gasBottles:'Gasflaschen',gas:'Gasprüfung',contracts:'Verträge'};
 heading('Zusammenfassung');
 Object.entries(d).forEach(([k,v])=>row(lab[k]||k,money(v)));
 row('Gesamtkosten',money(tot),true);
 yy-=7;text(`Übernachtungen ${y}: ${totalNights(p,y)}`,M,yy,11,true);yy-=25;

 const ar=annualRentFor(p,y);
 if(ar&&isTieredRent(ar)){
  const b=tieredRentBreakdown(p,ar),labels=['0-90','91-180','181-365'],extras=Array.isArray(ar.extras)?ar.extras:[];
  heading('Jahresmiete');row('Platzgrundmiete',money(ar.baseAmount));row('Tatsächliche Übernachtungen',String(b.used));
  labels.forEach((l,i)=>row('Erwachsene '+l,`${num(b.adult[i])} Person(en) x ${money(b.adultRates[i])} = ${money(Number(b.adult[i])*Number(b.adultRates[i]))}`));
  labels.forEach((l,i)=>row('Kinder 4-15 '+l,`${num(b.child[i])} Kind(er) x ${money(b.childRates[i])} = ${money(Number(b.child[i])*Number(b.childRates[i]))}`));
  labels.forEach((l,i)=>row('Auto '+l,`${num(b.carTier[i])} Auto(s) x ${money(b.carRates[i])} = ${money(Number(b.carTier[i])*Number(b.carRates[i]))}`));
  paragraph('Die Übernachtungszahl bestimmt nur die Tarifstufe; der Tarifbetrag wird nicht pro Nacht multipliziert.');
  if(Number(ar.trailerCount||0))row('Anhänger',`${num(ar.trailerCount)} x ${money(ar.trailerAnnualPrice)} = ${money(b.trailerCost)}`);
  extras.forEach(e=>row(e.label||'Extra',`${num(e.qty||0)} x ${money(e.price)} = ${money(Number(e.qty||0)*Number(e.price||0))}`));
  if(b.missing.length)paragraph('Nicht berechnet ohne Geburtsdatum: '+b.missing.join(', '));row('Berechnete Jahresmiete',money(b.total),true)
 }else if(ar){heading('Jahresmiete - altes Preismodell');row('Berechnete Jahresmiete',money(annualRentTotal(ar,p)),true)}

 const rows=closingRows(p,y);
 heading('Alle Kostenpositionen');
 if(!rows.length)paragraph('Keine Kostenpositionen für dieses Jahr.');
 rows.forEach(x=>{
  ensure(45);
  text(`${x.d} | ${x.c}`,M,yy,10,true);
  text(money(x.a),R,yy,10,true,true);
  yy-=13;
  const desc=pdfWrap(x.t||'',92);
  for(const ln of desc){ensure(13);text(ln,M+8,yy,8.5);yy-=11}
  line(yy-1);yy-=10
 });

 // Seitenzahlen
 const totalPages=pages.length;
 pages.forEach((commands,i)=>{
  commands.push(`BT /F1 8 Tf 0.35 0.35 0.35 rg 1 0 0 1 ${M} 25 Tm (${pdfWinAnsi('CampManager')}) Tj ET`);
  const footer=`Seite ${i+1} von ${totalPages}`;
  const fx=Math.max(M,R-width(footer,8));
  commands.push(`BT /F1 8 Tf 0.35 0.35 0.35 rg 1 0 0 1 ${fx.toFixed(2)} 25 Tm (${pdfWinAnsi(footer)}) Tj ET`)
 });

 const objects={};
 objects[1]='<< /Type /Catalog /Pages 2 0 R >>';
 const kids=pages.map((_,i)=>`${5+i*2} 0 R`).join(' ');
 objects[2]=`<< /Type /Pages /Count ${pages.length} /Kids [${kids}] >>`;
 objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
 objects[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
 pages.forEach((commands,i)=>{
  const pageId=5+i*2,contentId=6+i*2,stream=commands.join('\n')+'\n';
  objects[pageId]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W.toFixed(2)} ${H.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentId} 0 R >>`;
  objects[contentId]=`<< /Length ${stream.length} >>\nstream\n${stream}endstream`
 });
 const maxId=4+pages.length*2;
 let pdf='%PDF-1.4\n% CampManager PDF\n',offsets=[0];
 for(let id=1;id<=maxId;id++){offsets[id]=pdf.length;pdf+=`${id} 0 obj\n${objects[id]}\nendobj\n`}
 const xref=pdf.length;
 pdf+=`xref\n0 ${maxId+1}\n0000000000 65535 f \n`;
 for(let id=1;id<=maxId;id++)pdf+=String(offsets[id]).padStart(10,'0')+' 00000 n \n';
 pdf+=`trailer\n<< /Size ${maxId+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
 return new Blob([pdf],{type:'application/pdf'})
}
function annualPdfFilename(p,y){
 const pitch=String(p.site.pitch||'').replace(/[^A-Za-z0-9_-]+/g,'-')||'Stellplatz';
 return `CampManager-Jahresabschluss-${y}-Platz-${pitch}.pdf`
}
async function saveAnnualPdf(){
 try{
  const p=place(),blob=buildAnnualPdfBlob(p,closingYear),name=annualPdfFilename(p,closingYear);
  if(typeof File!=='undefined'&&navigator.share){
   const file=new File([blob],name,{type:'application/pdf'});
   const can=!navigator.canShare||navigator.canShare({files:[file]});
   if(can){
    try{await navigator.share({title:`CampManager Jahresabschluss ${closingYear}`,files:[file]});return}
    catch(e){if(e?.name==='AbortError')return;console.warn('PDF teilen',e)}
   }
  }
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);
  toast('PDF erstellt')
 }catch(e){console.warn(e);toast('PDF konnte nicht erstellt werden')}
}

  try{

async function imgData(file,max=420,q=.78){const b=await createImageBitmap(file);let w=b.width,h=b.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);b.close();return c.toDataURL('image/jpeg',q)}

const DOC_DB='campmanager_documents_v1',DOC_STORE='files';
let docDbPromise=null;
function openDocDb(){
 if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB nicht verfügbar'));
 if(docDbPromise)return docDbPromise;
 docDbPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open(DOC_DB,1);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DOC_STORE))db.createObjectStore(DOC_STORE)};
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error||new Error('Dokumentenspeicher konnte nicht geöffnet werden'));
 });
 return docDbPromise
}
async function dbPut(id,blob){const db=await openDocDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DOC_STORE,'readwrite');tx.objectStore(DOC_STORE).put(blob,id);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)})}
async function dbGet(id){const db=await openDocDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DOC_STORE,'readonly'),q=tx.objectStore(DOC_STORE).get(id);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}
async function dbDel(id){const db=await openDocDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DOC_STORE,'readwrite');tx.objectStore(DOC_STORE).delete(id);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)})}
async function compress(file){
 if(!file)return file;
 if(!String(file.type||'').startsWith('image/')||file.size<=3*1024*1024)return file;
 try{
  const bmp=await createImageBitmap(file),max=1800,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');ctx.drawImage(bmp,0,0,w,h);bmp.close?.();
  const out=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.84));
  return out||file
 }catch(e){console.warn('Bildkomprimierung',e);return file}
}

function storagePath(path){return String(path||'').split('/').map(encodeURIComponent).join('/')}
async function storageRequest(path,{method='GET',body=null,mime='application/octet-stream',upsert=false}={}){
 if(!cloudReady()||!session?.access_token)throw new Error('Cloud nicht angemeldet');
 const h={apikey:cfg.key,Authorization:'Bearer '+session.access_token};if(body!==null)h['Content-Type']=mime;if(upsert)h['x-upsert']='true';
 const r=await fetch(cloudBase()+'/storage/v1/object/campmanager-documents/'+storagePath(path),{method,headers:h,body});if(!r.ok){const t=await r.text();throw new Error(t||('HTTP '+r.status))}return r
}

function localMonthKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(k){const [y,m]=String(k||'').split('-').map(Number);return y&&m?new Date(y,m-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'}):String(k||'')}
function lastDayOfMonth(d=new Date()){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function monthlyBackupDue(){
 const n=new Date(),key=localMonthKey(n),last=localStorage.getItem(MONTH_BACKUP)||'';
 if(last===key)return null;
 const snooze=localStorage.getItem(MONTH_SNOOZE)||'';
 if(snooze===today())return null;
 return n.getDate()>=Math.max(28,lastDayOfMonth(n)-2)?key:null
}
function blobToBase64(blob){return blob.arrayBuffer().then(buf=>{const u=new Uint8Array(buf);let out='';const chunk=0x8000;for(let i=0;i<u.length;i+=chunk)out+=String.fromCharCode(...u.subarray(i,i+chunk));return btoa(out)})}
function base64ToBlob(base64,mime='application/octet-stream'){const bin=atob(base64),chunk=0x8000,parts=[];for(let i=0;i<bin.length;i+=chunk){const end=Math.min(i+chunk,bin.length),u=new Uint8Array(end-i);for(let j=i;j<end;j++)u[j-i]=bin.charCodeAt(j);parts.push(u)}return new Blob(parts,{type:mime})}
async function buildFullBackup(targetMonth=''){
 const files=[],missing=[];
 for(const p of state.places){
  for(const d of p.documents){
   let b=await dbGet(d.id).catch(()=>null);
   if(!b&&d.cloudPath&&cloudReady()&&session?.access_token){try{b=await downloadDocumentCloud(d.cloudPath);if(b)await dbPut(d.id,b)}catch(e){console.warn('Dokument für Backup nicht ladbar',d.id,e)}}
   if(!b){missing.push({id:d.id,title:d.title||d.filename||'Dokument'});continue}
   try{files.push({id:d.id,mime:b.type||d.mime||'application/octet-stream',filename:d.filename||'',base64:await blobToBase64(b)})}catch(e){console.warn('Dokument für Backup nicht lesbar',d.id,e);missing.push({id:d.id,title:d.title||d.filename||'Dokument'})}
  }
 }
 return {format:'CampManagerBackup',formatVersion:1,appVersion:APP_VERSION,createdAt:new Date().toISOString(),month:targetMonth||localMonthKey(),state:JSON.parse(JSON.stringify(state)),files,missingDocuments:missing}
}
async function saveBackupFile(pkg,name){
 const text=JSON.stringify(pkg,null,2),blob=new Blob([text],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
 if(navigator.share&&navigator.canShare?.({files:[file]})){
  try{await navigator.share({files:[file],title:'CampManager Backup',text:'CampManager Sicherungsdatei'});return true}catch(e){if(e?.name!=='AbortError')console.warn(e);if(e?.name==='AbortError')return false}
 }
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return true
}
async function exportFullBackup(targetMonth=localMonthKey(),monthly=false){
 try{
  toast('Backup wird erstellt …');
  const pkg=await buildFullBackup(targetMonth),name=`CampManager-Backup-${targetMonth}-${today()}.campbackup.json`;
  const started=await saveBackupFile(pkg,name);if(!started)return false;
  if(monthly){localStorage.setItem(MONTH_BACKUP,targetMonth);localStorage.removeItem(MONTH_SNOOZE)}
  const miss=pkg.missingDocuments?.length||0;
  toast(miss?`Backup erstellt · ${miss} Dokument(e) nicht verfügbar`:'Backup vollständig erstellt');
  return true
 }catch(e){console.error(e);toast('Backup konnte nicht erstellt werden');return false}
}
async function restoreFullBackupObject(raw){
 const pkg=raw?.format==='CampManagerBackup'&&raw?.state?raw:null;
 const newState=normalize(pkg?pkg.state:raw);
 if(pkg?.files?.length){for(const f of pkg.files){if(!f?.id||!f?.base64)continue;await dbPut(f.id,base64ToBlob(f.base64,f.mime||'application/octet-stream'))}}
 state=newState;persist();render();schedulePush();if(cloudReady()&&session?.access_token)pushCloud().catch(console.warn);
 return {files:pkg?.files?.length||0,missing:pkg?.missingDocuments?.length||0}
}
async function restoreBackupFile(file){
 const raw=JSON.parse(await file.text());
 if(!raw||typeof raw!=='object')throw new Error('invalid');
 if(!confirm('Dieses Backup wiederherstellen? Die aktuellen App-Daten werden durch den Sicherungsstand ersetzt.'))return false;
 const r=await restoreFullBackupObject(raw);closeModal();toast(r.missing?`Backup wiederhergestellt · ${r.missing} Dokument(e) fehlten bereits im Backup`:'Backup vollständig wiederhergestellt');return true
}

 modal(`Monatsbackup · ${monthLabel(key)}`,`<div class="notice good"><b>Monatsende:</b> Möchtest du jetzt eine Sicherungsdatei erstellen?</div><p>Die Datei enthält deine CampManager-Daten und die verfügbaren gescannten Dokumente. Auf iPhone/iPad kannst du sie über das Teilen-Menü direkt in der <b>Dateien-App</b> sichern.</p><p class="rowsub">Beim späteren Einspielen werden Stellplätze, Kosten, Jahresmieten mit Preisstaffeln, Geburtsdaten, Übernachtungen, Strom inkl. kWh-Preis und monatlicher Zählermiete, Hin- und Rückfahrten inkl. Monats-/Jahresstatistik, Petroleum, Fristen, Verträge inkl. Handyverträgen, Gespräche und Dokumente wieder an ihren ursprünglichen Stellen hergestellt.</p>`,`<button class="btn sec" type="button" id="monthBackupLater">Später</button><button class="btn" type="button" id="monthBackupNow">Backup erstellen</button>`)

}

function settings(){
 modal('Einstellungen',`<h3>Cloud-Sync</h3><form id="cfgForm"><div class="formgrid">${field('Supabase Project URL','url',cfg.url||'','url')}${field('Publishable / Anon Key','key',cfg.key||'')}</div></form><div class="toolbar"><button class="btn sec" id="saveCfg">Cloud-Daten speichern</button><button class="btn sec" id="showSql">SQL anzeigen</button></div>${cloudReady()&&!session?.access_token?`<form id="authForm"><div class="formgrid">${field('Familien-E-Mail','email','','email','required')}${field('Passwort','password','','password','required minlength="6"')}</div></form><div class="toolbar"><button class="btn" id="login">Anmelden</button><button class="btn sec" id="signup">Konto erstellen</button></div>`:''}${session?.access_token?`<div class="notice good">Cloud angemeldet · Daten und Dokumente können zwischen Geräten synchronisiert werden.</div><div class="toolbar"><button class="btn" id="pull">Cloud laden</button><button class="btn" id="push">Cloud speichern</button><button class="btn sec" id="syncDocs">Dokumente synchronisieren</button><button class="btn sec" id="logout">Abmelden</button></div><h3>Automatische Sicherung</h3><div class="toolbar"><button class="btn sec" id="backupNow">Cloud-Backup jetzt</button><button class="btn sec" id="backupCloudList">Cloud-Backups</button></div><div class="notice">Bei aktiver Cloud wird höchstens einmal pro Tag automatisch eine Datensicherung angelegt.</div>`:''}<div class="divider"></div><h3>Monatsbackup als Datei</h3><div class="toolbar"><button class="btn sec" id="backupOut">Backup-Datei erstellen</button><label class="btn sec">Backup wiederherstellen<input id="backupIn" type="file" accept=".json,.campbackup,application/json" hidden></label></div><div class="notice">Die Sicherungsdatei enthält alle CampManager-Daten und – soweit verfügbar – auch die gescannten Dokumentdateien. Am Monatsende fragt die App automatisch nach einem Monatsbackup.</div><div class="rowsub">Letztes Monatsbackup: ${localStorage.getItem(MONTH_BACKUP)?esc(monthLabel(localStorage.getItem(MONTH_BACKUP))):'noch keines'}</div><div class="divider"></div><h3>Installation</h3><div class="notice">Als App auf dem Startbildschirm nutzbar. Auf iPhone/iPad: in Safari „Teilen“ → „Zum Home-Bildschirm“.</div><div class="toolbar">${installPrompt?'<button class="btn" id="installApp">App installieren</button>':''}</div><h3>App-Version</h3><div class="notice">CampManager v${APP_VERSION} · PWA-Updateprüfung aktiv</div><div class="toolbar"><button class="btn sec" id="checkUpdate">Jetzt nach Update suchen</button></div>`,`<button class="btn sec" type="button" data-close>Schließen</button>`);
 $('#saveCfg').onclick=()=>{const d=Object.fromEntries(new FormData($('#cfgForm')).entries());cfg={url:String(d.url||'').trim().replace(/\/+$/,''),key:String(d.key||'').trim()};localStorage.setItem(CFG,JSON.stringify(cfg));toast('Cloud-Daten gespeichert');closeModal();settings()};
 $('#showSql').onclick=()=>modal('Supabase SQL',`<pre style="white-space:pre-wrap;background:#132019;color:#e8efe9;padding:10px;border-radius:12px;font-size:11px">${esc(SQL)}</pre>`,`<button class="btn sec" type="button" data-close>Schließen</button>`);
 if($('#login'))$('#login').onclick=async()=>{const d=Object.fromEntries(new FormData($('#authForm')).entries());try{await login(d.email,d.password);await pullCloud();await dailyCloudBackup(false).catch(()=>{});await syncPendingDocuments().catch(()=>{});closeModal();toast('Angemeldet')}catch(e){console.warn(e);toast('Anmeldung fehlgeschlagen')}};
 if($('#signup'))$('#signup').onclick=async()=>{const d=Object.fromEntries(new FormData($('#authForm')).entries());try{const s=await signup(d.email,d.password);toast(s?.access_token?'Konto erstellt':'Bitte E-Mail bestätigen')}catch(e){console.warn(e);toast('Konto konnte nicht erstellt werden')}};
 if($('#pull'))$('#pull').onclick=()=>pullCloud();if($('#push'))$('#push').onclick=()=>pushCloud();if($('#syncDocs'))$('#syncDocs').onclick=async()=>toast((await syncPendingDocuments())+' Dokument(e) hochgeladen');
 if($('#backupNow'))$('#backupNow').onclick=async()=>{try{await dailyCloudBackup(true);toast('Cloud-Backup erstellt')}catch(e){console.warn(e);toast('Cloud-Backup fehlgeschlagen')}};
 if($('#backupCloudList'))$('#backupCloudList').onclick=()=>cloudBackupManager();
 if($('#installApp'))$('#installApp').onclick=()=>installApp();
 if($('#checkUpdate'))$('#checkUpdate').onclick=async()=>{const newer=await checkForUpdate(true);toast(newer?'Update verfügbar':'App ist aktuell')};
 if($('#logout'))$('#logout').onclick=()=>{session=null;localStorage.removeItem(SES);closeModal();render();toast('Abgemeldet')};
 $('#backupOut').onclick=()=>exportFullBackup(localMonthKey(),false);
 $('#backupIn').onchange=async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{await restoreBackupFile(f)}catch(e){console.warn(e);toast('Ungültige oder beschädigte Backup-Datei')}}
}
function downloadBackup(data,name){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}


document.addEventListener('submit',e=>{
 const f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();if(!f.reportValidity())return;
 if(f.id==='editForm'){saveEditor(f);return}
 if(f.id==='depositForm'){saveDeposit(f);return}
 if(f.id==='insuranceForm'){saveInsurance(f);return}
 if(f.id==='insuranceClaimForm'){saveInsuranceClaim(f);return}
 if(f.id==='placeForm'){savePlace(f);return}
 if(f.id==='docForm'){const d=Object.fromEntries(new FormData(f).entries()),id=f.dataset.id;let x=place().documents.find(x=>x.id===id);if(!x){x={...(pendingDocs.get(id)||{}),id,createdAt:new Date().toISOString()};place().documents.push(x)}Object.assign(x,d);if(isPlanDoc(x)){delete x.year;delete x.amount}else{x.year=d.year||String(new Date((d.date||today())+'T12:00:00').getFullYear())}pendingDocs.delete(id);closeModal();save();toast(isPlanDoc(x)?'Plan gespeichert':'Dokument gespeichert');return}
});
document.addEventListener('click',e=>{
 if(e.target.closest('[data-close]')){closeModal();return}
 const n=e.target.closest('[data-view]');if(n){show(n.dataset.view);return}
 const g=e.target.closest('[data-go]');if(g){const v=g.dataset.go;if(g.dataset.jump)tab[v]=g.dataset.jump;render();show(v);return}
 const tj=e.target.closest('[data-tabsec]');if(tj){tab[tj.dataset.tabsec]=tj.dataset.tab;try{if(tj.dataset.tabsec==='more')renderMore();else if(tj.dataset.tabsec==='costs')renderCosts();else if(tj.dataset.tabsec==='care')renderCare();else render()}catch(err){console.error(err);toast('Ansicht konnte nicht geladen werden')}show(tj.dataset.tabsec);return}
 const cj=e.target.closest('[data-costjump]');if(cj){tab.costs=cj.dataset.costjump;renderCosts();show('costs');return}
 if(e.target.closest('[data-depositedit]')){depositEditor();return}
 if(e.target.closest('[data-insurance-edit]')){insuranceEditor();return}
 if(e.target.closest('[data-claim-add]')){insuranceClaimEditor();return}
 const claimEdit=e.target.closest('[data-claim-edit]');if(claimEdit){insuranceClaimEditor(claimEdit.dataset.claimEdit);return}
 const claimDel=e.target.closest('[data-claim-del]');if(claimDel){deleteInsuranceClaim(claimDel.dataset.claimDel);return}
 const claimCam=e.target.closest('[data-claim-camera]');if(claimCam){pickInsuranceFile('claim',claimCam.dataset.claimCamera,true);return}
 const claimUp=e.target.closest('[data-claim-upload]');if(claimUp){pickInsuranceFile('claim',claimUp.dataset.claimUpload,false);return}
 if(e.target.closest('[data-insdoc-camera]')){pickInsuranceFile('document','',true);return}
 if(e.target.closest('[data-insdoc-file]')){pickInsuranceFile('document','',false);return}
 const planAdd=e.target.closest('[data-planadd]');if(planAdd){planAddDialog(planAdd.dataset.planadd);return}
 const planSrc=e.target.closest('[data-plan-source]');if(planSrc){pickPlanFile(planSrc.dataset.planCategory,planSrc.dataset.planSource==='camera');return}
 const mobile=e.target.closest('[data-mobilecontract]');if(mobile){editor('contract',{contractType:'mobile',billingPeriod:'monthly',name:'Handyvertrag'});return}
 const ds=e.target.closest('[data-deadline-status]');if(ds){setDeadlineStatus(ds.dataset.deadlineId,ds.dataset.deadlineStatus);return}
 const a=e.target.closest('[data-add]');if(a){editor(a.dataset.add);return}
 const ed=e.target.closest('[data-edit]');if(ed){editItem(ed.dataset.edit,ed.dataset.id);return}
 const de=e.target.closest('[data-del]');if(de){deleteItem(de.dataset.del,de.dataset.id);return}
 const ps=e.target.closest('[data-placeswitch]');if(ps){switchPlace(ps.dataset.placeswitch);return}
 const pti=e.target.closest('[data-place-titleimage]');if(pti){titleImageEditor(pti.dataset.placeTitleimage);return}
 const pe=e.target.closest('[data-placeedit]');if(pe){closeModal();placeEditor(pe.dataset.placeedit);return}
 if(e.target.closest('[data-placeadd]')){closeModal();placeEditor();return}
 const pd=e.target.closest('[data-placedel]');if(pd){deletePlace(pd.dataset.placedel);return}
 if(e.target.closest('[data-docscan]')){$('#camInput')?.click();return}
 if(e.target.closest('[data-docupload]')){$('#fileInput')?.click();return}
 const dop=e.target.closest('[data-docopen]');if(dop){openDoc(dop.dataset.docopen);return}
 const ded=e.target.closest('[data-docedit]');if(ded){const x=place().documents.find(x=>x.id===ded.dataset.docedit);if(x)docEditor(x,false);return}
 const ddl=e.target.closest('[data-docdel]');if(ddl){delDoc(ddl.dataset.docdel);return}
 const rx=e.target.closest('[data-rentextra-del]');if(rx){rx.closest('[data-rentextra]')?.remove();return}
 const br=e.target.closest('[data-backuprestore]');if(br){if(!confirm('Diesen Sicherungsstand wiederherstellen?'))return;getCloudBackup(br.dataset.backuprestore).then(x=>{if(x?.data){state=normalize(x.data);persist();render();closeModal();toast('Backup wiederhergestellt')}}).catch(()=>toast('Wiederherstellung fehlgeschlagen'));return}
 const bd=e.target.closest('[data-backupdownload]');if(bd){getCloudBackup(bd.dataset.backupdownload).then(x=>x?.data&&downloadBackup(x.data,'campmanager-cloud-backup-'+bd.dataset.backupdownload+'.json')).catch(()=>toast('Download fehlgeschlagen'));return}
 if(e.target.id==='syncDocsBtn'){syncPendingDocuments().then(n=>toast(n+' Dokument(e) hochgeladen')).catch(()=>toast('Synchronisierung fehlgeschlagen'));return}
 if(e.target.id==='updateBtn'){applyUpdate();return}
 if(e.target.closest('[data-report-close]')){closeAnnualReport();return}
 if(e.target.id==='reportSaveBtn'){saveAnnualPdf();return}
 if(e.target.id==='reportPrintBtn'){printAnnualReport();return}
 if(e.target.id==='pdfBtn'){openPdf();return}
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-check]')){const x=place().shopping.find(x=>x.id===e.target.dataset.check);if(x){x.done=e.target.checked;save()}return}
 if(e.target.id==='closeYear'){closingYear=Number(e.target.value)||yearNow();renderCosts();show('costs');return}
 if(e.target.id==='travelYear'){travelStatsYear=Number(e.target.value)||yearNow();renderCosts();show('costs');return}
 if(e.target.id==='camInput'||e.target.id==='fileInput'){const f=e.target.files?.[0];e.target.value='';if(f)handleDoc(f).catch(err=>{console.error(err);toast('Dokument konnte nicht gespeichert werden')});return}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
$('#homeBtn').onclick=()=>show('dashboard');
$('#placeBtn').onclick=switcher;
$('#settingsBtn').onclick=settings;

let swReg=null,updateReloading=false,installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
async function installApp(){if(!installPrompt){toast('Auf iPhone/iPad über Teilen → Zum Home-Bildschirm installieren');return}try{await installPrompt.prompt();await installPrompt.userChoice}catch(e){console.warn(e)}installPrompt=null;closeModal()}
function showUpdate(){const b=$('#updateBanner');if(b)b.classList.remove('hidden')}
async function checkForUpdate(manual=false){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return false;const v=await r.json();if(Number(v.version)>APP_VERSION){showUpdate();return true}if(swReg)await swReg.update();return !!swReg?.waiting}catch(e){if(manual)console.warn(e);return false}}
async function registerPWA(){
 if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
 try{swReg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});if(swReg.waiting)showUpdate();swReg.addEventListener('updatefound',()=>{const w=swReg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updateReloading)return;updateReloading=true;location.reload()})}catch(e){console.warn('Service Worker',e)}
}
async function applyUpdate(){try{if(swReg)await swReg.update();if(swReg?.waiting){swReg.waiting.postMessage({type:'SKIP_WAITING'});return}location.replace(location.pathname+'?v='+Date.now())}catch{location.reload()}}
(async()=>{render();await registerPWA();setTimeout(()=>checkForUpdate(false),1200);if(cloudReady()&&session?.access_token){await pullCloud();dailyCloudBackup(false).catch(console.warn);syncPendingDocuments().catch(console.warn)}setTimeout(monthlyBackupPrompt,1800)})();
})();
