<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173c29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CampManager">
<title>CampManager – Komplettversion</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f1e9;--card:#fff;--ink:#14221a;--muted:#6d776f;--line:#e2ddd1;
  --green:#173c29;--green2:#2f6a49;--soft:#edf3ef;--gold:#c98a34;--danger:#a84032;
  --dangerbg:#fae8e4;--warnbg:#fff3db;--goodbg:#e9f4ed;--shadow:0 10px 30px rgba(26,42,31,.09);
  --radius:22px;--safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(180deg,#faf8f3 0,#f2eee4 100%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:30;height:76px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(250,248,243,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(226,221,209,.9)}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;text-align:left;color:inherit;min-width:0}
.brand-logo{width:58px;height:50px;object-fit:contain;padding:3px;background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.10)}
.brand-fallback{width:58px;height:50px;border-radius:12px;background:var(--green);color:#fff;display:none;place-items:center;font-size:24px}
.brand-copy{display:flex;flex-direction:column;min-width:0}
.brand-copy strong{font-size:17px}
.brand-copy small{color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.top-actions{display:flex;align-items:center;gap:7px}
.status{border:0;font-size:11px;font-weight:800;padding:7px 9px;border-radius:999px;background:#efe9dc;color:#675c4a;white-space:nowrap}
.status.cloud{background:#e3f2e8;color:#24593a}.status.syncing{background:#fff0d2;color:#7b5720}.status.error{background:#f8ded8;color:#7e3228}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.app-shell{max-width:1100px;margin:0 auto;padding:18px 16px calc(98px + var(--safe))}
.view{display:none}.view.active{display:block}
.view-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}
.view-head h1{margin:0;font-size:27px}.view-head p{margin:4px 0 0;color:var(--muted)}
.hero{background:linear-gradient(135deg,#173c29 0%,#102319 72%);color:#fff;border-radius:28px;padding:20px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(180px,.5fr);gap:18px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-85px;top:-125px;background:radial-gradient(circle,#d79a42 0,rgba(215,154,66,.08) 66%,transparent 68%)}
.hero-copy{position:relative;z-index:1}.hero h1{font-size:30px;margin:5px 0}.hero p{margin:0;color:#dbe7df}
.hero-logo{width:100%;height:auto;max-height:230px;object-fit:contain;background:#fff;border-radius:18px;align-self:center;position:relative;z-index:1;border:1px solid rgba(255,255,255,.15)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}
.card{grid-column:span 4;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.full{grid-column:1/-1}.card.half{grid-column:span 6}
.card h2,.card h3{margin:0 0 8px}.card h2{font-size:18px}.card h3{font-size:15px}.card p{margin:4px 0;color:var(--muted)}
.metric{font-size:30px;font-weight:850;letter-spacing:-.035em}.metric small{font-size:13px;color:var(--muted);font-weight:650}
.card-action{border:1px solid var(--line);text-align:left;color:inherit;background:#fff}.card-action:active{transform:scale(.995)}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick{border:1px solid var(--line);background:#fff;padding:14px 12px;border-radius:16px;text-align:center;color:var(--ink)}.quick b{display:block;font-size:21px;margin-bottom:4px}.quick small{color:var(--muted)}
.section-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}.section-tabs::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:999px;font-weight:750;font-size:13px}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.row-main{flex:1;min-width:0}.row-title{font-weight:780;overflow-wrap:anywhere}.row-sub{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.row-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.mini{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px}.danger{color:var(--danger)}.done .row-title{text-decoration:line-through;color:var(--muted)}
.btn{border:0;background:var(--green);color:#fff;font-weight:800;padding:11px 15px;border-radius:13px}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger);color:#fff}.btn.block{width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.empty{padding:28px 16px;border:1px dashed #ccc4b7;border-radius:18px;text-align:center;color:var(--muted);background:rgba(255,255,255,.45)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}
.field input,.field select,.field textarea{border:1px solid #dcd5c8;background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none;width:100%}.field textarea{min-height:92px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7aa08a;box-shadow:0 0 0 3px rgba(65,113,82,.12)}
.modal{border:0;background:transparent;padding:0;width:min(650px,calc(100vw - 20px));max-height:92vh}.modal::backdrop{background:rgba(9,20,14,.55);backdrop-filter:blur(4px)}
.modal-card{background:#faf8f3;border-radius:24px;border:1px solid var(--line);padding:16px;box-shadow:0 30px 90px rgba(0,0,0,.28);max-height:92vh;overflow:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.modal-head h2{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.bottom-nav{position:fixed;z-index:25;bottom:0;left:0;right:0;padding:7px 10px calc(7px + var(--safe));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav-btn{border:0;background:transparent;color:#6f776f;border-radius:14px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav-btn span{font-size:20px;line-height:1}.nav-btn small{font-size:11px;font-weight:800}.nav-btn.active{color:var(--green);background:#edf3ef}
.toast{position:fixed;z-index:120;left:50%;bottom:90px;max-width:calc(100vw - 24px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#102219;color:#fff;padding:11px 15px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);transition:.2s;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.badge{display:inline-flex;align-items:center;border-radius:999px;background:#eef2ee;color:#31543e;padding:4px 8px;font-size:12px;font-weight:800}.badge.hero-badge{background:rgba(255,255,255,.12);color:#fff}
.notice{background:#f7f3e9;border:1px solid #e5dcc6;border-radius:16px;padding:12px;margin:12px 0}.notice.good{background:var(--goodbg);border-color:#cfe3d6}.notice.bad{background:var(--dangerbg);border-color:#ecc8c1}.notice.warn{background:var(--warnbg);border-color:#ecd9b2}
.small-note{font-size:12px;color:var(--muted);line-height:1.45}.divider{height:1px;background:var(--line);margin:16px 0}.kpi{display:flex;align-items:center;justify-content:space-between;gap:12px}.kpi strong{font-size:18px}
.cost-bars{display:flex;flex-direction:column;gap:9px}.cost-line{display:grid;grid-template-columns:150px 1fr 90px;gap:9px;align-items:center;font-size:13px}.bar{height:9px;background:#eee8dc;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold))}.right{text-align:right}
.codebox{background:#132019;color:#e7efe9;padding:12px;border-radius:14px;white-space:pre-wrap;overflow:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;max-height:260px}
.overdue{border-color:#ecc8c1;background:#fff9f7}
@media(max-width:760px){
  .hero{grid-template-columns:1fr}.hero-logo{max-height:280px}.card,.card.half{grid-column:1/-1}
  .quick-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
  .cost-line{grid-template-columns:115px 1fr 80px}.view-head h1{font-size:24px}.brand-copy small{max-width:135px}
  .status{padding:7px 8px}.top-actions{gap:5px}
}
@media(min-width:900px){
  .bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:620px;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}
  .app-shell{padding-bottom:110px}.hero{padding:24px}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" id="brandBtn" type="button" aria-label="Startseite">
    <img id="brandLogo" class="brand-logo" src="logo.jpg" alt="CampManager Logo">
    <span id="brandFallback" class="brand-fallback">⛺</span>
    <span class="brand-copy"><strong>CampManager</strong><small id="campNameTop">Platz 161</small></span>
  </button>
  <div class="top-actions">
    <button id="placeSwitchBtn" class="status" type="button">Platz 161 ▾</button>
    <span id="syncBadge" class="status">Lokal</span>
    <button id="accountBtn" class="icon-btn" type="button" aria-label="Einstellungen">⚙</button>
  </div>
</header>

<main class="app-shell" id="app">
  <section id="view-dashboard" class="view active"></section>
  <section id="view-shopping" class="view"></section>
  <section id="view-costs" class="view"></section>
  <section id="view-care" class="view"></section>
  <section id="view-more" class="view"></section>
</main>

<nav class="bottom-nav" aria-label="Hauptnavigation">
  <button class="nav-btn active" type="button" data-view="dashboard"><span>⌂</span><small>Start</small></button>
  <button class="nav-btn" type="button" data-view="shopping"><span>✓</span><small>Einkäufe</small></button>
  <button class="nav-btn" type="button" data-view="costs"><span>€</span><small>Kosten</small></button>
  <button class="nav-btn" type="button" data-view="care"><span>♧</span><small>Pflege</small></button>
  <button class="nav-btn" type="button" data-view="more"><span>•••</span><small>Mehr</small></button>
</nav>

<dialog id="modal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Eintrag</h2>
      <button type="button" class="icon-btn" data-modal-close aria-label="Schließen">×</button>
    </div>
    <div id="modalBody"></div>
    <div id="modalActions" class="modal-actions"></div>
  </div>
</dialog>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
'use strict';

const STORAGE_KEY='campmanager_complete_v6';
const CLOUD_CFG_KEY='campmanager_cloud_cfg_v6';
const CLOUD_SESSION_KEY='campmanager_cloud_session_v6';
const OLD_KEYS=['campmanager_full_v5','campmanager_full_v4','campmanager_full_v3','campmanager_full_v2','campmanager_full_v1','campmanager_onefile_v1','platz161_state_v4','platz161_state_v2'];

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const yearNow=()=>new Date().getFullYear();
const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString('de-DE'):'–';
const money=v=>Number(v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num=(v,d=0)=>Number(v||0).toLocaleString('de-DE',{maximumFractionDigits:d});
const parseDate=v=>v?new Date(v+'T12:00:00'):null;
const nightsBetween=(a,b)=>a&&b?Math.max(0,Math.round((parseDate(b)-parseDate(a))/86400000)):0;

function blankPlace(name='Campingplatz',pitch='161'){
  return {
    id:uid(),
    site:{campName:name,pitch,area:'',notes:''},
    nextArrival:'',
    shopping:[],
    costs:[],
    petroleum:[],
    electricity:[],
    stays:[],
    lawn:[],
    hedge:[],
    contracts:[],
    gasChecks:[]
  };
}
function defaults(){
  const first=blankPlace('Campingplatz','161');
  return {
    version:6,
    updatedAt:new Date().toISOString(),
    activePlaceId:first.id,
    family:[{id:uid(),name:'Marcel'},{id:uid(),name:'Denise'},{id:uid(),name:'Leon'},{id:uid(),name:'Luca'}],
    places:[first]
  };
}
function normalizePlace(p){
  return {
    id:p?.id||uid(),
    site:{campName:'Campingplatz',pitch:'',area:'',notes:'',...(p?.site||{})},
    nextArrival:p?.nextArrival||'',
    shopping:Array.isArray(p?.shopping)?p.shopping:[],
    costs:Array.isArray(p?.costs)?p.costs:[],
    petroleum:Array.isArray(p?.petroleum)?p.petroleum:[],
    electricity:Array.isArray(p?.electricity)?p.electricity:[],
    stays:Array.isArray(p?.stays)?p.stays:[],
    lawn:Array.isArray(p?.lawn)?p.lawn:[],
    hedge:Array.isArray(p?.hedge)?p.hedge:[],
    contracts:Array.isArray(p?.contracts)?p.contracts:[],
    gasChecks:Array.isArray(p?.gasChecks)?p.gasChecks:[]
  };
}
function normalize(raw){
  const d=defaults();
  if(!raw||typeof raw!=='object')return d;

  // New multi-place format.
  if(Array.isArray(raw.places)&&raw.places.length){
    const places=raw.places.map(normalizePlace);
    return {
      version:6,
      updatedAt:raw.updatedAt||new Date().toISOString(),
      activePlaceId:places.some(p=>p.id===raw.activePlaceId)?raw.activePlaceId:places[0].id,
      family:Array.isArray(raw.family)?raw.family:d.family,
      places
    };
  }

  // Migration from all previous single-place versions.
  const migrated=normalizePlace({
    site:raw.site||{campName:'Campingplatz',pitch:'161'},
    nextArrival:raw.nextArrival,
    shopping:raw.shopping,
    costs:raw.costs,
    petroleum:raw.petroleum,
    electricity:raw.electricity,
    stays:raw.stays,
    lawn:raw.lawn,
    hedge:raw.hedge,
    contracts:raw.contracts,
    gasChecks:raw.gasChecks
  });
  return {
    version:6,
    updatedAt:raw.updatedAt||new Date().toISOString(),
    activePlaceId:migrated.id,
    family:Array.isArray(raw.family)?raw.family:d.family,
    places:[migrated]
  };
}
function loadState(){
  try{
    const now=localStorage.getItem(STORAGE_KEY);
    if(now)return normalize(JSON.parse(now));
    for(const key of OLD_KEYS){
      const old=localStorage.getItem(key);
      if(old)return normalize(JSON.parse(old));
    }
  }catch(e){console.error('Daten laden fehlgeschlagen',e)}
  return defaults();
}

let state=loadState();
let activeView='dashboard';
const activeTab={costs:'overview',care:'lawn',more:'stays'};
let cloudCfg=loadCloudCfg();
let cloudSession=loadCloudSession();
let pushTimer=null;
let lastRemoteStamp='';

function place(){return state.places.find(p=>p.id===state.activePlaceId)||state.places[0]}
function saveLocal(){
  state.version=6;
  state.updatedAt=new Date().toISOString();
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    return true;
  }catch(e){
    console.error('Speichern fehlgeschlagen',e);
    toast('Speichern im Browser fehlgeschlagen');
    return false;
  }
}
function save({cloud=true}={}){
  if(!saveLocal())return false;
  renderAll();
  if(cloud)scheduleCloudPush();
  return true;
}
function toast(t){
  const el=$('#toast');if(!el)return;
  el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)
}
function empty(t){return '<div class="empty">'+esc(t)+'</div>'}
function tabs(section,items){return '<div class="section-tabs">'+items.map(([k,l])=>'<button type="button" class="chip '+(activeTab[section]===k?'active':'')+'" data-section="'+section+'" data-tab="'+k+'">'+esc(l)+'</button>').join('')+'</div>'}

function petroleumStock(p=place()){
  const rows=[...p.petroleum].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
  let stock=0;
  for(const x of rows){
    const liters=Number(x.liters||0);
    if(x.kind==='stock')stock=liters;
    else if(x.kind==='purchase')stock+=liters;
    else stock-=liters;
  }
  return stock;
}
function totalNights(p=place(),year=null){
  return p.stays.reduce((sum,x)=>{
    if(!x.arrival||!x.departure)return sum;
    if(year&&Number(x.arrival.slice(0,4))!==Number(year))return sum;
    return sum+nightsBetween(x.arrival,x.departure);
  },0)
}
function costData(p=place(),y=yearNow()){
  const d={annual:0,repairs:0,purchases:0,other:0,electricity:0,petroleum:0};
  p.costs.filter(x=>Number(x.year)===Number(y)).forEach(x=>d[x.category]=(d[x.category]||0)+Number(x.amount||0));
  p.electricity.filter(x=>Number(x.year)===Number(y)).forEach(x=>d.electricity+=Number(x.cost||0)+Number(x.meterRent||0));
  p.petroleum.filter(x=>x.kind==='purchase'&&(x.date||'').startsWith(String(y))).forEach(x=>d.petroleum+=Number(x.price||0));
  return d;
}
function arrivalText(p=place()){
  if(!p.nextArrival)return'Noch nicht geplant';
  const d=Math.round((parseDate(p.nextArrival)-parseDate(today()))/86400000);
  if(d===0)return'Heute';if(d===1)return'Morgen';if(d>1)return'in '+d+' Tagen';return fmtDate(p.nextArrival)
}
function deadlineStatus(date){
  if(!date)return'';
  const d=Math.ceil((parseDate(date)-parseDate(today()))/86400000);
  if(d<0)return'Überfällig';if(d===0)return'Heute';if(d===1)return'Morgen';if(d<=30)return'in '+d+' Tagen';return fmtDate(date)
}
function nextDeadline(p=place()){
  const rows=[];
  p.contracts.forEach(x=>{const d=x.noticeDate||x.endDate;if(d)rows.push({date:d,title:x.noticeDate?'Vertragsfrist':'Vertragsende',detail:x.name,type:'contracts'})});
  p.gasChecks.forEach(x=>{if(x.nextDue)rows.push({date:x.nextDue,title:'Gasprüfung',detail:x.company||'Nächste Prüfung',type:'gas'})});
  rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return rows.find(x=>x.date>=today())||rows[0]||null
}

function setSync(kind,text){const b=$('#syncBadge');if(!b)return;b.className='status'+(kind?' '+kind:'');b.textContent=text}
function renderTop(){
  const p=place();
  $('#campNameTop').textContent=(p.site.campName||'Campingplatz')+' · Platz '+(p.site.pitch||'–');
  $('#placeSwitchBtn').textContent='Platz '+(p.site.pitch||'–')+' ▾';
  setSync(cloudReady()&&cloudSession?.access_token?'cloud':'',cloudReady()&&cloudSession?.access_token?'Cloud':'Lokal')
}

function renderDashboard(){
  const p=place(),y=yearNow(),c=costData(p,y),total=Object.values(c).reduce((a,b)=>a+b,0),next=nextDeadline(p);
  $('#view-dashboard').innerHTML=`
  <div class="hero">
    <div class="hero-copy">
      <div class="badge hero-badge">${state.places.length} ${state.places.length===1?'Stellplatz':'Stellplätze'}</div>
      <h1>Die Hentschel's</h1>
      <p>${esc(p.site.campName||'Campingplatz')} · Platz ${esc(p.site.pitch||'–')}</p>
    </div>
    <img class="hero-logo" src="logo.jpg" alt="CampManager Logo" onerror="this.style.display='none'">
  </div>
  <div class="grid">
    <button type="button" class="card card-action" data-open="arrival"><h3>Nächste Anreise</h3><div class="metric">${p.nextArrival?fmtDate(p.nextArrival):'–'}</div><p>${esc(arrivalText(p))}</p></button>
    <button type="button" class="card card-action" data-go="shopping"><h3>Offene Einkäufe</h3><div class="metric">${p.shopping.filter(x=>!x.done).length}</div><p>noch zu besorgen</p></button>

  p.contracts.forEach(x=>{const d=x.noticeDate||x.endDate;if(d)out.push({type:'contract',id:x.id,date:d,endDate:d,title:(x.noticeDate?'Vertragsfrist: ':'Vertragsende: ')+(x.name||'Vertrag'),description:[x.provider,x.notes].filter(Boolean).join(' · ')})});
  p.gasChecks.forEach(x=>{if(x.nextDue)out.push({type:'gas',id:x.id,date:x.nextDue,endDate:x.nextDue,title:'Gasprüfung – '+(x.company||p.site.campName||'Campingplatz'),description:[x.result,x.notes].filter(Boolean).join(' · ')})});
  return out.sort((a,b)=>String(a.date).localeCompare(String(b.date)))

function calendarPanel(p){
  const rows=calendarEvents(p),future=rows.filter(x=>x.date>=today());
  return `<div class="notice good"><strong>Apple-/Gerätekalender:</strong> Termine werden als .ics-Datei übergeben. Auf dem iPhone kannst du sie anschließend dem Kalender hinzufügen.</div>
  <div class="toolbar"><button type="button" class="btn" id="exportCalendarAll">📅 Alle Termine</button><button type="button" class="btn secondary" id="exportCalendarFuture">Nur zukünftige</button></div>
  ${future.length?'<div class="list">'+future.map(x=>`<div class="row"><div class="row-main"><div class="row-title">${esc(x.title)}</div><div class="row-sub">${fmtDate(x.date)}${x.endDate&&x.endDate!==x.date?' – '+fmtDate(x.endDate):''}</div></div><button type="button" class="mini" data-cal="${x.type}" data-id="${x.id}">📅</button></div>`).join('')+'</div>':empty('Keine zukünftigen Kalendereinträge.')}`
}
function icsDate(date,add=0){const d=parseDate(date);if(add)d.setDate(d.getDate()+add);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function icsEscape(v=''){return String(v).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsEvent(ev){
  return ['BEGIN:VEVENT','UID:'+icsEscape((ev.type||'event')+'-'+(ev.id||uid())+'@campmanager'),'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z'),'DTSTART;VALUE=DATE:'+icsDate(ev.date),'DTEND;VALUE=DATE:'+icsDate(ev.endDate||ev.date,1),'SUMMARY:'+icsEscape(ev.title||'CampManager Termin'),ev.description?'DESCRIPTION:'+icsEscape(ev.description):'','END:VEVENT'].filter(Boolean).join('\r\n')
}
async function exportIcs(events,filename){
  if(!events.length){toast('Keine Kalendereinträge vorhanden');return}
  const content=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CampManager//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH',...events.map(icsEvent),'END:VCALENDAR'].join('\r\n');
  const blob=new Blob([content],{type:'text/calendar;charset=utf-8'});
  const file=new File([blob],filename,{type:'text/calendar'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'CampManager Kalender'});return}catch(e){if(e?.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
function addOneCalendar(type,itemId){
  const ev=type==='arrival'?calendarEvents().find(x=>x.type==='arrival'):calendarEvents().find(x=>x.type===type&&String(x.id)===String(itemId));
  if(!ev){toast('Kein Datum vorhanden');return}
  exportIcs([ev],'campmanager-'+type+'-'+ev.date+'.ics')
}

function closeModal(){const d=$('#modal');if(d.open)d.close()}
const field=(l,n,v='',t='text',extra='')=>`<div class="field"><label>${esc(l)}</label><input name="${n}" type="${t}" value="${esc(v??'')}" ${extra}></div>`;
const area=(l,n,v='')=>`<div class="field full"><label>${esc(l)}</label><textarea name="${n}">${esc(v??'')}</textarea></div>`;
const select=(l,n,v,opts)=>`<div class="field"><label>${esc(l)}</label><select name="${n}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(v)===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`;
const saveButtons=()=>`<button type="button" class="btn secondary" data-modal-close>Abbrechen</button><button type="button" class="btn" data-modal-save>Speichern</button>`;

function collection(type){
  const p=place();
  return {shopping:p.shopping,cost:p.costs,petroleum:p.petroleum,electricity:p.electricity,lawn:p.lawn,hedge:p.hedge,stay:p.stays,contract:p.contracts,gas:p.gasChecks,family:state.family}[type]
}
function openEditor(type,existing=null){
  const x=existing||{};let title='Eintrag',body='';
  if(type==='shopping'){title=existing?'Einkauf bearbeiten':'Einkauf hinzufügen';body=`${field('Artikel / Sache','name',x.name,'text','required')}${field('Menge','quantity',x.quantity)}${area('Notiz','note',x.note)}`}
  if(type==='cost'){title=existing?'Kosten bearbeiten':'Kosten hinzufügen';body=`${select('Kategorie','category',x.category||'annual',[['annual','Stellplatz/Jahresgebühr'],['repairs','Reparatur'],['purchases','Neuanschaffung'],['other','Sonstiges']])}${field('Jahr','year',x.year||yearNow(),'number','min="2000" max="2200" required')}${field('Betrag €','amount',x.amount,'number','step="0.01" min="0" required')}${area('Notiz','note',x.note)}`}
  if(type==='petroleum'){title=existing?'Petroleum bearbeiten':'Petroleum buchen';body=`${select('Art','kind',x.kind||'purchase',[['purchase','Einkauf'],['usage','Verbrauch'],['stock','Bestand setzen']])}${field('Datum','date',x.date||today(),'date','required')}${field('Liter','liters',x.liters,'number','step="0.1" min="0" required')}${field('Preis gesamt € (nur Einkauf)','price',x.price,'number','step="0.01" min="0"')}${area('Notiz','note',x.note)}<div class="field full"><div class="notice"><strong>Bestand setzen:</strong> Der eingetragene Wert wird an diesem Datum als tatsächlicher Petroleum-Bestand übernommen.</div></div>`}
  if(type==='electricity'){title=existing?'Stromwert bearbeiten':'Strom-Jahreswert';body=`${field('Jahr','year',x.year||yearNow(),'number','min="2000" max="2200" required')}${field('Verbrauch kWh','consumption',x.consumption,'number','step="0.1" min="0" required')}${field('Stromkosten €','cost',x.cost,'number','step="0.01" min="0"')}${field('Zählermiete €','meterRent',x.meterRent,'number','step="0.01" min="0"')}`}
  if(type==='lawn'||type==='hedge'){title=type==='lawn'?'Rasenschnitt':'Heckenschnitt';body=`${field('Datum','date',x.date||today(),'date','required')}${area('Notiz','note',x.note)}`}
  if(type==='stay'){title=existing?'Aufenthalt bearbeiten':'Aufenthalt hinzufügen';body=`${field('Anreise','arrival',x.arrival||today(),'date','required')}${field('Abreise','departure',x.departure,'date','required')}${field('Personen','people',x.people)}${area('Notiz','note',x.note)}`}
  if(type==='contract'){title=existing?'Vertrag bearbeiten':'Vertrag hinzufügen';body=`${field('Vertrag','name',x.name,'text','required')}${field('Anbieter','provider',x.provider)}${field('Vertragsbeginn','startDate',x.startDate,'date')}${field('Vertragsende','endDate',x.endDate,'date')}${field('Kündigungs-/Prüffrist','noticeDate',x.noticeDate,'date')}${field('Kosten pro Jahr €','annualCost',x.annualCost,'number','step="0.01" min="0"')}${area('Notiz','notes',x.notes)}`}
  if(type==='gas'){title=existing?'Gasprüfung bearbeiten':'Gasprüfung hinzufügen';body=`${field('Prüfdatum','date',x.date||today(),'date','required')}${field('Nächste Prüfung','nextDue',x.nextDue,'date')}${select('Ergebnis','result',x.result||'bestanden',[['bestanden','Bestanden'],['maengel','Mängel'],['offen','Offen']])}${field('Prüfer / Firma','company',x.company)}${field('Kosten €','cost',x.cost,'number','step="0.01" min="0"')}${area('Notiz / Mängel','notes',x.notes)}`}
  if(type==='family'){title=existing?'Person bearbeiten':'Person hinzufügen';body=`${field('Name','name',x.name,'text','required')}`}
  modal(title,`<form id="editForm" novalidate><div class="form-grid">${body}</div></form>`,saveButtons());
  $('[data-modal-save]').onclick=()=>saveEditor(type,existing?.id||null)
}
function saveEditor(type,existingId){
  const form=$('#editForm');if(!form.reportValidity())return;
  const arr=collection(type),old=existingId?arr.find(x=>x.id===existingId):null;
  const item={...(old||{}),...Object.fromEntries(new FormData(form).entries()),id:existingId||uid(),createdAt:old?.createdAt||new Date().toISOString()};
  if(type==='shopping')item.done=old?!!old.done:false;
  if(type==='stay'&&item.departure<item.arrival){toast('Abreise darf nicht vor der Anreise liegen');return}
  if(type==='electricity'&&!existingId&&arr.some(x=>String(x.year)===String(item.year))){toast('Für dieses Jahr existiert bereits ein Stromwert');return}
  if(type==='hedge'&&!existingId){
    const y=(item.date||'').slice(0,4);if(y&&arr.filter(x=>(x.date||'').startsWith(y)).length>=2){toast('Für '+y+' sind bereits 2 Heckenschnitte eingetragen');return}
  }
  if(old)Object.assign(old,item);else arr.push(item);
  closeModal();
  if(save())toast('Gespeichert')
}
function editItem(type,itemId){const x=collection(type).find(x=>x.id===itemId);if(x)openEditor(type,x)}
function deleteItem(type,itemId){
  if(!confirm('Eintrag wirklich löschen?'))return;
  const arr=collection(type),ix=arr.findIndex(x=>x.id===itemId);if(ix<0)return;arr.splice(ix,1);save()
}
function openArrival(){
  const p=place();modal('Nächste Anreise',`<form id="arrivalForm"><div class="form-grid">${field('Datum','date',p.nextArrival,'date')}</div></form>`,saveButtons());
  $('[data-modal-save]').onclick=()=>{p.nextArrival=new FormData($('#arrivalForm')).get('date')||'';closeModal();if(save())toast('Anreise gespeichert')}
}
function openPlaceEditor(placeId=null){
  const existing=placeId?state.places.find(x=>x.id===placeId):null,x=existing?.site||{};
  modal(existing?'Stellplatz bearbeiten':'Stellplatz hinzufügen',`<form id="placeForm"><div class="form-grid">${field('Campingplatz / Name','campName',x.campName,'text','required')}${field('Stellplatznummer','pitch',x.pitch,'text','required')}${field('Fläche m²','area',x.area,'number','step="0.1" min="0"')}${area('Notizen','notes',x.notes)}</div></form>`,saveButtons());
  $('[data-modal-save]').onclick=()=>{
    const f=$('#placeForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f).entries());
    if(existing)existing.site={...existing.site,...d};
    else{const p=blankPlace(d.campName,d.pitch);p.site={...p.site,...d};state.places.push(p);state.activePlaceId=p.id}
    closeModal();if(save())toast(existing?'Stellplatz gespeichert':'Stellplatz hinzugefügt')
  }
}
function switchPlace(id){if(!state.places.some(x=>x.id===id))return;state.activePlaceId=id;closeModal();save();toast('Stellplatz gewechselt')}
function deletePlace(id){
  if(state.places.length<=1){toast('Mindestens ein Stellplatz muss bleiben');return}
  const p=state.places.find(x=>x.id===id);if(!p)return;
  if(!confirm((p.site.campName||'Campingplatz')+' · Platz '+(p.site.pitch||'')+' wirklich löschen?'))return;
  state.places=state.places.filter(x=>x.id!==id);
  if(state.activePlaceId===id)state.activePlaceId=state.places[0].id;
  save();toast('Stellplatz gelöscht')
}
function openPlaceSwitcher(){
  modal('Stellplatz wechseln',`<div class="list">${state.places.map(p=>`<button type="button" class="row" data-place-switch="${p.id}" style="width:100%;text-align:left"><div class="row-main"><div class="row-title">${esc(p.site.campName||'Campingplatz')} · Platz ${esc(p.site.pitch||'–')}</div><div class="row-sub">${p.id===state.activePlaceId?'Aktiv':'Antippen zum Wechseln'}</div></div>${p.id===state.activePlaceId?'<span class="badge">Aktiv</span>':'›'}</button>`).join('')}</div><div class="toolbar"><button type="button" class="btn" data-place-add>＋ Neuer Platz</button></div>`,'<button type="button" class="btn secondary" data-modal-close>Schließen</button>')
}

/* Optionaler Supabase Familien-Sync ohne externe JavaScript-Bibliothek */
function loadCloudCfg(){try{return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)||'{}')}catch{return{}}}
function loadCloudSession(){try{return JSON.parse(localStorage.getItem(CLOUD_SESSION_KEY)||'null')}catch{return null}}
function saveCloudCfg(v){cloudCfg=v;localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify(v))}
function saveCloudSession(v){cloudSession=v;if(v)localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(v));else localStorage.removeItem(CLOUD_SESSION_KEY)}
function cloudReady(){return !!(cloudCfg?.url&&cloudCfg?.anonKey)}
function cloudBase(){return String(cloudCfg.url||'').replace(/\/+$/,'')}
async function api(path,{method='GET',body=null,token=null,prefer=null}={}){
  if(!cloudReady())throw new Error('Cloud nicht eingerichtet');
  const headers={'apikey':cloudCfg.anonKey,'Authorization':'Bearer '+(token||cloudCfg.anonKey)};
  if(body!==null)headers['Content-Type']='application/json';if(prefer)headers['Prefer']=prefer;
  const res=await fetch(cloudBase()+path,{method,headers,body:body!==null?JSON.stringify(body):undefined});
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
  if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||('HTTP '+res.status));
  return data
}
async function refreshSession(){
  if(!cloudSession?.refresh_token)return false;
  try{const s=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:cloudSession.refresh_token}});saveCloudSession(s);return true}catch(e){saveCloudSession(null);return false}
}
async function ensureSession(){if(!cloudSession?.access_token)return false;if(cloudSession.expires_at&&Date.now()/1000>Number(cloudSession.expires_at)-60)return refreshSession();return true}
async function signIn(email,password){const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});saveCloudSession(s);return s}
async function signUp(email,password){const s=await api('/auth/v1/signup',{method:'POST',body:{email,password}});if(s?.access_token)saveCloudSession(s);return s}
async function signOut(){try{if(cloudSession?.access_token)await api('/auth/v1/logout',{method:'POST',token:cloudSession.access_token})}catch{}saveCloudSession(null);lastRemoteStamp='';renderAll()}
async function pullCloud({silent=false}={}){
  if(!cloudReady()||!await ensureSession())return false;if(!silent)setSync('syncing','Lädt…');
  try{
    const userId=cloudSession.user?.id;if(!userId)throw new Error('Benutzer-ID fehlt');
    const rows=await api('/rest/v1/camp_states?select=user_id,data,updated_at&user_id=eq.'+encodeURIComponent(userId)+'&limit=1',{token:cloudSession.access_token});
    if(rows?.[0]){
      if(!lastRemoteStamp||String(rows[0].updated_at)>String(lastRemoteStamp)){state=normalize(rows[0].data);saveLocal();lastRemoteStamp=rows[0].updated_at;renderAll()}
    }else await pushCloud({silent:true});
    setSync('cloud','Cloud');return true
  }catch(e){console.error(e);setSync('error','Cloud-Fehler');if(!silent)toast('Cloud laden fehlgeschlagen');return false}
}
async function pushCloud({silent=false}={}){
  if(!cloudReady()||!await ensureSession())return false;if(!silent)setSync('syncing','Speichert…');
  try{
    const userId=cloudSession.user?.id;if(!userId)throw new Error('Benutzer-ID fehlt');
    const stamp=new Date().toISOString();
    const data=await api('/rest/v1/camp_states?on_conflict=user_id',{method:'POST',token:cloudSession.access_token,prefer:'resolution=merge-duplicates,return=representation',body:{user_id:userId,data:state,updated_at:stamp}});
    lastRemoteStamp=data?.[0]?.updated_at||stamp;setSync('cloud','Cloud');return true
  }catch(e){console.error(e);setSync('error','Cloud-Fehler');if(!silent)toast('Cloud speichern fehlgeschlagen');return false}
}
function scheduleCloudPush(){if(!cloudReady()||!cloudSession)return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>pushCloud({silent:true}),700)}
function cloudSql(){return `create table if not exists public.camp_states (
  user_id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table public.camp_states enable row level security;
drop policy if exists "camp_select_own" on public.camp_states;
create policy "camp_select_own" on public.camp_states for select using (auth.uid() = user_id);
drop policy if exists "camp_insert_own" on public.camp_states;
create policy "camp_insert_own" on public.camp_states for insert with check (auth.uid() = user_id);
drop policy if exists "camp_update_own" on public.camp_states;
create policy "camp_update_own" on public.camp_states for update using (auth.uid() = user_id) with check (auth.uid() = user_id);
drop policy if exists "camp_delete_own" on public.camp_states;
create policy "camp_delete_own" on public.camp_states for delete using (auth.uid() = user_id);`}
function openSettings(){
  const signed=!!cloudSession?.access_token;
  modal('Einstellungen & Daten',`
  <h3>Stellplätze</h3><div class="toolbar"><button type="button" class="btn secondary" data-place-edit="${place().id}">Aktiven Platz bearbeiten</button><button type="button" class="btn secondary" id="settingsSwitchPlace">Platz wechseln</button><button type="button" class="btn secondary" data-place-add>＋ Platz</button></div>
  <p class="small-note">Das Logo wird vollständig angezeigt. Falls keine logo.jpg vorhanden ist, erscheint ein Zelt-Symbol.</p>
  <div class="divider"></div>
  <h3>Familien-Synchronisierung</h3>
  <div class="notice ${signed?'good':''}"><strong>${signed?'Cloud aktiv':'Optional'}</strong><br>${signed?'Angemeldet als '+esc(cloudSession.user?.email||'Familienkonto'):'Lokal funktioniert alles ohne Cloud. Für mehrere Geräte kannst du Supabase kostenlos einrichten.'}</div>
  <form id="cloudConfigForm"><div class="form-grid">${field('Supabase Project URL','url',cloudCfg.url||'','url','placeholder="https://xxxxx.supabase.co"')}${field('Supabase Anon/Public Key','anonKey',cloudCfg.anonKey||'','text','autocomplete="off"')}</div></form>
  <div class="toolbar"><button type="button" class="btn secondary" id="saveCloudConfig">Cloud-Daten speichern</button><button type="button" class="btn secondary" id="showSql">SQL anzeigen</button></div>
  ${cloudReady()?(signed?`<div class="toolbar"><button type="button" class="btn" id="pullNow">Cloud laden</button><button type="button" class="btn" id="pushNow">Cloud speichern</button><button type="button" class="btn secondary" id="logoutCloud">Abmelden</button></div>`:`<form id="authForm"><div class="form-grid">${field('Familien-E-Mail','email','','email','required')}${field('Passwort','password','','password','required minlength="6"')}</div></form><div class="toolbar"><button type="button" class="btn" id="loginCloud">Anmelden</button><button type="button" class="btn secondary" id="registerCloud">Familienkonto erstellen</button></div>`):''}
  <div class="divider"></div>
  <h3>Kalender</h3><div class="toolbar"><button type="button" class="btn secondary" id="settingsCalendar">📅 Termine exportieren</button></div>
  <div class="divider"></div>
  <h3>Datensicherung</h3><div class="toolbar"><button type="button" class="btn secondary" id="exportBackup">Backup exportieren</button><label class="btn secondary">Backup importieren<input id="importBackup" type="file" accept="application/json" hidden></label><button type="button" class="btn danger" id="resetLocal">Lokale Daten löschen</button></div>
  `,'<button type="button" class="btn secondary" data-modal-close>Schließen</button>');

  $('#settingsSwitchPlace').onclick=()=>{closeModal();openPlaceSwitcher()};
  $('#saveCloudConfig').onclick=()=>{const d=Object.fromEntries(new FormData($('#cloudConfigForm')).entries());saveCloudCfg({url:String(d.url||'').trim().replace(/\/+$/,''),anonKey:String(d.anonKey||'').trim()});toast('Cloud-Daten gespeichert');closeModal();openSettings()};
  $('#showSql').onclick=()=>{modal('Supabase SQL',`<p class="small-note">Einmal im Supabase SQL Editor ausführen:</p><pre class="codebox">${esc(cloudSql())}</pre><div class="toolbar"><button type="button" class="btn secondary" id="copySql">SQL kopieren</button></div>`,'<button type="button" class="btn secondary" data-modal-close>Schließen</button>');$('#copySql').onclick=async()=>{try{await navigator.clipboard.writeText(cloudSql());toast('SQL kopiert')}catch{toast('Kopieren nicht möglich')}}};
  if($('#loginCloud'))$('#loginCloud').onclick=async()=>{const f=$('#authForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f).entries());try{await signIn(d.email,d.password);await pullCloud({silent:true});closeModal();renderAll();toast('Cloud verbunden')}catch(e){toast('Anmeldung fehlgeschlagen: '+e.message)}};
  if($('#registerCloud'))$('#registerCloud').onclick=async()=>{const f=$('#authForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f).entries());try{const s=await signUp(d.email,d.password);if(s?.access_token){await pushCloud({silent:true});closeModal();renderAll();toast('Familienkonto erstellt')}else toast('Konto erstellt. Bitte E-Mail bestätigen.')}catch(e){toast('Konto konnte nicht erstellt werden: '+e.message)}};
  if($('#pullNow'))$('#pullNow').onclick=()=>pullCloud();
  if($('#pushNow'))$('#pushNow').onclick=()=>pushCloud();
  if($('#logoutCloud'))$('#logoutCloud').onclick=async()=>{await signOut();closeModal();toast('Cloud abgemeldet')};
  $('#settingsCalendar').onclick=()=>exportIcs(calendarEvents(),'campmanager-kalender.ics');
  $('#exportBackup').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='campmanager-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
  $('#importBackup').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state=normalize(JSON.parse(await f.text()));save();closeModal();toast('Backup importiert')}catch{toast('Ungültige Backup-Datei')}};
  $('#resetLocal').onclick=()=>{if(confirm('Wirklich alle lokalen CampManager-Daten löschen?')){state=defaults();save({cloud:false});closeModal();toast('Lokale Daten gelöscht')}}
}

document.addEventListener('click',e=>{
  const close=e.target.closest('[data-modal-close]');if(close){closeModal();return}
  const nav=e.target.closest('[data-view]');if(nav){showView(nav.dataset.view);return}
  const go=e.target.closest('[data-go]');if(go){const v=go.dataset.go;if(go.dataset.tab)activeTab[v]=go.dataset.tab;renderAll();showView(v);return}
  const tab=e.target.closest('[data-section][data-tab]');if(tab){activeTab[tab.dataset.section]=tab.dataset.tab;renderAll();showView(tab.dataset.section);return}
  if(e.target.id==='exportCalendarAll'){exportIcs(calendarEvents(),'campmanager-alle-termine.ics');return}
  if(e.target.id==='exportCalendarFuture'){exportIcs(calendarEvents().filter(x=>x.date>=today()),'campmanager-zukuenftige-termine.ics');return}
  const add=e.target.closest('[data-add]');if(add){openEditor(add.dataset.add);return}
  const edit=e.target.closest('[data-edit]');if(edit){editItem(edit.dataset.edit,edit.dataset.id);return}
  const del=e.target.closest('[data-del]');if(del){deleteItem(del.dataset.del,del.dataset.id);return}
  const cal=e.target.closest('[data-cal]');if(cal){addOneCalendar(cal.dataset.cal,cal.dataset.id||'');return}
  const open=e.target.closest('[data-open]');if(open){if(open.dataset.open==='arrival')openArrival();return}
  const sw=e.target.closest('[data-place-switch]');if(sw){switchPlace(sw.dataset.placeSwitch);return}
  const pa=e.target.closest('[data-place-add]');if(pa){closeModal();openPlaceEditor();return}
  const pe=e.target.closest('[data-place-edit]');if(pe){closeModal();openPlaceEditor(pe.dataset.placeEdit);return}
  const pd=e.target.closest('[data-place-delete]');if(pd){deletePlace(pd.dataset.placeDelete);return}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-toggle-shopping]')){
    const x=place().shopping.find(r=>r.id===e.target.dataset.toggleShopping);if(x){x.done=e.target.checked;save()}
  }
});

$('#brandBtn').onclick=()=>showView('dashboard');
$('#placeSwitchBtn').onclick=openPlaceSwitcher;
$('#accountBtn').onclick=openSettings;
$('#brandLogo').onerror=()=>{$('#brandLogo').style.display='none';$('#brandFallback').style.display='grid'};

window.addEventListener('focus',()=>{if(cloudReady()&&cloudSession)pullCloud({silent:true})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloudReady()&&cloudSession)pullCloud({silent:true})});

async function boot(){
  try{
    renderAll();
    if(cloudReady()&&cloudSession){setSync('syncing','Cloud…');await pullCloud({silent:true});renderAll()}
  }catch(e){
    console.error(e);
    $('#app').innerHTML='<div class="card full"><h2>CampManager konnte nicht starten</h2><p>'+esc(e.message||String(e))+'</p></div>'
  }
}
boot();
})();
