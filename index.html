<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173c29">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CampManager v18</title>
<style>
:root{
 --bg:#f5f2ea;--card:#fff;--ink:#142019;--muted:#6d766e;--line:#ddd7ca;
 --green:#173c29;--green2:#2e6548;--soft:#edf3ef;--danger:#a43e32;--gold:#c78b38;
 --shadow:0 10px 28px rgba(21,38,27,.08);--radius:20px;--safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;min-width:0}
button{cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:40;display:flex;flex-direction:column;gap:6px;padding:8px 12px;background:rgba(250,248,243,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.toprow,.subrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}.subrow{min-width:0}.topname{font-size:13px;color:var(--muted);font-weight:700;min-width:0;flex:1;white-space:normal;overflow-wrap:anywhere;line-height:1.2}
.brand{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:0;color:inherit;text-align:left;min-width:0}
.logo{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line)}
.brandcopy{min-width:0}.brandcopy b{font-size:16px;white-space:nowrap}
.ver{font-size:10px;background:var(--green);color:#fff;padding:2px 6px;border-radius:999px;vertical-align:2px}
.topright{display:flex;align-items:center;gap:6px}
.placebtn,.status{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-weight:800;font-size:12px;color:var(--ink)}
.placebtn{display:flex;align-items:center;gap:6px}
.placebtn img{width:23px;height:23px;border-radius:7px;object-fit:cover}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px}
main{max-width:1100px;margin:auto;padding:16px 14px calc(94px + var(--safe))}
.view{display:none}.view.active{display:block}
.hero{background:linear-gradient(135deg,#173c29,#10261a);color:#fff;border-radius:26px;padding:18px;display:grid;grid-template-columns:1.5fr .6fr;gap:14px;align-items:center;box-shadow:var(--shadow)}
.hero h1{margin:6px 0;font-size:28px}.hero p{margin:0;color:#dce7df}.hero img{width:100%;max-height:200px;object-fit:contain;background:#fff;border-radius:16px}
.badge{display:inline-flex;border-radius:999px;padding:4px 8px;background:#edf3ef;color:#2b5c3f;font-size:12px;font-weight:800}.hero .badge{background:rgba(255,255,255,.13);color:#fff}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:12px}
.card{grid-column:span 4;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.card.half{grid-column:span 6}.card.full{grid-column:1/-1}
.card h2,.card h3{margin:0 0 7px}.card h2{font-size:18px}.card h3{font-size:15px}.card p{margin:3px 0;color:var(--muted)}
.cardaction{border:1px solid var(--line);text-align:left;color:inherit}
.metric{font-size:28px;font-weight:850;letter-spacing:-.03em}.metric small{font-size:12px;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:13px}.head h1{margin:0;font-size:25px}.head p{margin:3px 0 0;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 13px}
.btn{border:0;background:var(--green);color:#fff;font-weight:800;padding:10px 13px;border-radius:12px}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.btn.block{width:100%}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;font-size:13px;color:var(--ink)}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:15px;background:#fff;border:1px solid var(--line)}
.rowmain{flex:1;min-width:0}.rowtitle{font-weight:800;overflow-wrap:anywhere}.rowsub{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.rowactions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px}.mini.danger{color:var(--danger)}
.empty{padding:25px 14px;text-align:center;border:1px dashed #cfc6b8;border-radius:16px;color:var(--muted);background:rgba(255,255,255,.45)}
.notice{padding:11px;border:1px solid #dfd6bf;border-radius:14px;background:#f9f4e8;margin:10px 0}.notice.good{background:#eaf4ed;border-color:#cfe2d5}.notice.warn{background:#fff1da;border-color:#ecd8af}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}
.field input,.field select,.field textarea{width:100%;font-size:16px;line-height:1.2;border:1px solid #d9d2c5;background:#fff;border-radius:11px;padding:10px;color:var(--ink);outline:none}.field textarea{min-height:74px;resize:vertical}
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:8px;background:rgba(9,20,14,.58);backdrop-filter:blur(4px)}
.modalcard{width:min(100%,620px);max-height:calc(100dvh - 16px);overflow-y:auto;overflow-x:hidden;background:#faf8f3;border-radius:22px;border:1px solid var(--line);padding:12px;box-shadow:0 30px 90px rgba(0,0,0,.28)}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-12px;background:#faf8f3;padding:3px 0 8px;z-index:2}.modalhead h2{margin:0;font-size:23px}
.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:-12px;background:#faf8f3;padding:8px 0 2px;margin-top:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + var(--safe));background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav{border:0;background:transparent;border-radius:12px;padding:6px 3px;color:#6c756d;display:flex;flex-direction:column;align-items:center;gap:2px}.nav span{font-size:19px}.nav small{font-size:10px;font-weight:800}.nav.active{background:#edf3ef;color:var(--green)}
.toast{position:fixed;left:50%;bottom:86px;z-index:120;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#102319;color:#fff;padding:10px 14px;border-radius:999px;font-weight:750;transition:.2s;max-width:calc(100vw - 24px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}.quick b{display:block;font-size:20px}.quick small{color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:13px;object-fit:cover;background:#f2efe7;border:1px solid var(--line);flex:0 0 44px}.avatar.ph{display:grid;place-items:center;font-size:20px}
.photoPreview{width:88px;height:88px;border-radius:16px;object-fit:cover;background:#eee;border:1px solid var(--line)}
.costline{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:13px}.bar{height:8px;background:#eee8dd;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold))}.right{text-align:right}
.docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.doc{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px}.docthumb{width:100%;aspect-ratio:4/3;border-radius:11px;background:#f1eee7;display:grid;place-items:center;font-size:36px;overflow:hidden}.docthumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.conversation{white-space:pre-wrap;line-height:1.42;margin-top:6px}
.divider{height:1px;background:var(--line);margin:14px 0}
@media(max-width:760px){
 .hero{grid-template-columns:1fr}.hero img{max-height:240px}.card,.card.half{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick{grid-template-columns:repeat(2,1fr)}.docgrid{grid-template-columns:1fr}.costline{grid-template-columns:115px 1fr 75px}.top{padding-left:10px;padding-right:10px}.topname{font-size:12px}.placebtn,.status{font-size:11px;padding:6px 8px}.logo{width:44px;height:44px}
}
@media(min-width:900px){.bottom{left:50%;right:auto;transform:translateX(-50%);width:620px;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}}

@media(min-width:761px){
 .top{gap:4px}
 .subrow{padding-left:57px}
 .topname{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

</style>
</head>
<body>
<header class="top">
 <div class="toprow">
  <button class="brand" id="homeBtn" type="button">
   <img class="logo" id="logoImg" src="logo.jpg" alt="Logo">
   <div class="brandcopy"><b>CampManager <span class="ver">v18</span></b></div>
  </button>
  <div class="topright">
   <span class="status" id="syncStatus">Lokal</span>
   <button class="iconbtn" id="settingsBtn" type="button">⚙</button>
  </div>
 </div>
 <div class="subrow">
  <div id="topName" class="topname">Campingplatz</div>
  <button class="placebtn" id="placeBtn" type="button"><span>Platz ▾</span></button>
 </div>
</header>

<main>
 <section id="v-dashboard" class="view active"></section>
 <section id="v-shopping" class="view"></section>
 <section id="v-costs" class="view"></section>
 <section id="v-care" class="view"></section>
 <section id="v-more" class="view"></section>
</main>

<nav class="bottom">
 <button class="nav active" data-view="dashboard"><span>⌂</span><small>Start</small></button>
 <button class="nav" data-view="shopping"><span>✓</span><small>Einkäufe</small></button>
 <button class="nav" data-view="costs"><span>€</span><small>Kosten</small></button>
 <button class="nav" data-view="care"><span>♧</span><small>Pflege</small></button>
 <button class="nav" data-view="more"><span>•••</span><small>Mehr</small></button>
</nav>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
 <div class="modalcard">
  <div class="modalhead"><h2 id="modalTitle">Eintrag</h2><button class="iconbtn" type="button" data-close>×</button></div>
  <div id="modalBody"></div>
  <div id="modalActions" class="modalactions"></div>
 </div>
</div>
<div id="toast" class="toast"></div>

<script>
(()=>{'use strict';

const KEY='campmanager_complete_v18';
const OLD=['campmanager_complete_v17','campmanager_complete_v16','campmanager_complete_v15','campmanager_complete_v14','campmanager_complete_v13','campmanager_complete_v12','campmanager_complete_v11','campmanager_complete_v10','campmanager_complete_v9','campmanager_complete_v8','campmanager_complete_v7','campmanager_complete_v6','campmanager_full_v5','campmanager_full_v4','campmanager_full_v3','campmanager_full_v2','campmanager_full_v1'];
const CFG='campmanager_cloud_cfg_v16', SES='campmanager_cloud_session_v16';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(16).slice(2);
const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10), yearNow=()=>new Date().getFullYear();
const fmt=v=>v?new Date(v+'T12:00:00').toLocaleDateString('de-DE'):'–';
const money=v=>Number(v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num=(v,d=0)=>Number(v||0).toLocaleString('de-DE',{maximumFractionDigits:d});
const dparse=v=>v?new Date(v+'T12:00:00'):null;
const nights=(a,b)=>a&&b?Math.max(0,Math.round((dparse(b)-dparse(a))/86400000)):0;

function blankPlace(name='Campingplatz',pitch='161'){
 return {id:uid(),site:{campName:name,pitch,area:'',notes:'',photoData:''},shopping:[],costs:[],annualRent:[],petroleum:[],electricity:[],stays:[],lawn:[],hedge:[],contracts:[],gasChecks:[],documents:[],conversations:[]}
}
function defaults(){
 const p=blankPlace('Campingplatz','161');
 return {version:16,updatedAt:new Date().toISOString(),activePlaceId:p.id,family:[{id:uid(),name:'Marcel'},{id:uid(),name:'Denise'},{id:uid(),name:'Leon'},{id:uid(),name:'Luca'}],places:[p]}
}
function normPlace(p={}){
 return {
  id:p.id||uid(),
  site:{campName:'Campingplatz',pitch:'',area:'',notes:'',photoData:'',...(p.site||{})},
  shopping:Array.isArray(p.shopping)?p.shopping:[],
  costs:Array.isArray(p.costs)?p.costs:[],
  annualRent:Array.isArray(p.annualRent)?p.annualRent:[],
  petroleum:Array.isArray(p.petroleum)?p.petroleum:[],
  electricity:Array.isArray(p.electricity)?p.electricity:[],
  stays:Array.isArray(p.stays)?p.stays:[],
  lawn:Array.isArray(p.lawn)?p.lawn:[],
  hedge:Array.isArray(p.hedge)?p.hedge:[],
  contracts:Array.isArray(p.contracts)?p.contracts:[],
  gasChecks:Array.isArray(p.gasChecks)?p.gasChecks:[],
  documents:Array.isArray(p.documents)?p.documents:[],
  conversations:Array.isArray(p.conversations)?p.conversations:[]
 }
}
function normalize(raw){
 const d=defaults(); if(!raw||typeof raw!=='object')return d;
 if(Array.isArray(raw.places)&&raw.places.length){
  const places=raw.places.map(normPlace);
  return {version:16,updatedAt:raw.updatedAt||new Date().toISOString(),activePlaceId:places.some(p=>p.id===raw.activePlaceId)?raw.activePlaceId:places[0].id,family:Array.isArray(raw.family)?raw.family:d.family,places}
 }
 const p=normPlace(raw);
 return {version:16,updatedAt:raw.updatedAt||new Date().toISOString(),activePlaceId:p.id,family:Array.isArray(raw.family)?raw.family:d.family,places:[p]}
}
function load(){
 try{
  const cur=localStorage.getItem(KEY); if(cur)return normalize(JSON.parse(cur));
  for(const k of OLD){const x=localStorage.getItem(k);if(x)return normalize(JSON.parse(x))}
 }catch(e){console.warn(e)}
 return defaults()
}
let state=load(), view='dashboard';
const tab={costs:'overview',care:'lawn',more:'stays'};
function place(){return state.places.find(p=>p.id===state.activePlaceId)||state.places[0]}
function persist(){
 state.version=18;state.updatedAt=new Date().toISOString();
 try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Speichern im Browser fehlgeschlagen');return false}
}
function save(){const ok=persist();render();schedulePush();return ok}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2100)}
function empty(t){return `<div class="empty">${esc(t)}</div>`}
function tabs(sec,items){return `<div class="tabs">${items.map(([k,l])=>`<button type="button" class="chip ${tab[sec]===k?'active':''}" data-tabsec="${sec}" data-tab="${k}">${esc(l)}</button>`).join('')}</div>`}
function avatar(p,cls='avatar'){return p.site.photoData?`<img class="${cls}" src="${p.site.photoData}" alt="">`:`<span class="${cls} ph">⛺</span>`}

function petroleumStock(p=place()){
 let s=0;[...p.petroleum].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||''))).forEach(x=>{
  const l=Number(x.liters||0); if(x.kind==='stock')s=l;else if(x.kind==='purchase')s+=l;else s-=l
 });return s
}
function totalNights(p=place(),y=null){return p.stays.reduce((s,x)=>s+((!y||Number((x.arrival||'').slice(0,4))===Number(y))?nights(x.arrival,x.departure):0),0)}
function annualRentTotal(x){return x?Number(x.baseAmount||0)+Number(x.extraAdultNights||0)*Number(x.adultPrice||0)+Number(x.extraChildNights||0)*Number(x.childPrice||0):0}
function annualRentFor(p,y){return p.annualRent.find(x=>Number(x.year)===Number(y))||null}
function contractActive(x,y){
 const a=y+'-01-01',b=y+'-12-31';
 return !(x.startDate&&x.startDate>b)&&!(x.endDate&&x.endDate<a)
}
function contractBaseAmount(x){return Number(x.costAmount ?? x.annualCost ?? 0)}
function contractBillingPeriod(x){return x.billingPeriod||'yearly'}
function contractMonthsInYear(x,y){
 if(!contractActive(x,y))return 0;
 let startMonth=1,endMonth=12;
 if(x.startDate&&Number(x.startDate.slice(0,4))===Number(y))startMonth=Number(x.startDate.slice(5,7))||1;
 if(x.endDate&&Number(x.endDate.slice(0,4))===Number(y))endMonth=Number(x.endDate.slice(5,7))||12;
 return Math.max(0,endMonth-startMonth+1)
}
function contractCostForYear(x,y){
 const amount=contractBaseAmount(x);
 if(!amount||!contractActive(x,y))return 0;
 return contractBillingPeriod(x)==='monthly'?amount*contractMonthsInYear(x,y):amount
}
function costData(p,y){
 const d={annual:0,repairs:0,purchases:0,other:0,electricity:0,petroleum:0,gas:0,contracts:0};
 const r=annualRentFor(p,y);if(r)d.annual+=annualRentTotal(r);
 p.costs.filter(x=>Number(x.year)===Number(y)).forEach(x=>{const k=x.category||'other';d[k]=(d[k]||0)+Number(x.amount||0)});
 p.electricity.filter(x=>Number(x.year)===Number(y)).forEach(x=>d.electricity+=Number(x.cost||0)+Number(x.meterRent||0));
 p.petroleum.filter(x=>x.kind==='purchase'&&(x.date||'').startsWith(String(y))).forEach(x=>d.petroleum+=Number(x.price||0));
 p.gasChecks.filter(x=>(x.date||'').startsWith(String(y))).forEach(x=>d.gas+=Number(x.cost||0));
 p.contracts.filter(x=>contractActive(x,y)).forEach(x=>d.contracts+=contractCostForYear(x,y));
 return d
}
function nextDeadline(p){
 const r=[];p.contracts.forEach(x=>{const d=x.noticeDate||x.endDate;if(d)r.push({d,t:'Vertrag: '+(x.name||'')})});p.gasChecks.forEach(x=>{if(x.nextDue)r.push({d:x.nextDue,t:'Gasprüfung'})});r.sort((a,b)=>a.d.localeCompare(b.d));return r.find(x=>x.d>=today())||r[0]||null
}

function renderTop(){
 const p=place();
 $('#topName').textContent=p.site.campName||'Campingplatz';
 $('#placeBtn').innerHTML=`${p.site.photoData?`<img src="${p.site.photoData}" alt="">`:''}<span>Platz ${esc(p.site.pitch||'–')} ▾</span>`;
 $('#syncStatus').textContent=cloudReady()&&session?.access_token?'Cloud':'Lokal'
}
function renderDashboard(){
 const p=place(),y=yearNow(),c=costData(p,y),total=Object.values(c).reduce((a,b)=>a+b,0),dl=nextDeadline(p);
 $('#v-dashboard').innerHTML=`<div class="hero"><div><span class="badge">${state.places.length} ${state.places.length===1?'Stellplatz':'Stellplätze'}</span><h1>Die Hentschel's</h1><p>${esc(p.site.campName)} · Platz ${esc(p.site.pitch||'–')}</p></div><img src="logo.jpg" alt="Logo" onerror="this.style.display='none'"></div>
 <div class="grid">
  <button class="card cardaction" data-go="shopping"><h3>Offene Einkäufe</h3><div class="metric">${p.shopping.filter(x=>!x.done).length}</div><p>noch offen</p></button>
  <button class="card cardaction" data-go="more" data-jump="stays"><h3>Übernachtungen ${y}</h3><div class="metric">${totalNights(p,y)}</div><p>Gesamt ${totalNights(p)}</p></button>
  <button class="card cardaction" data-go="costs" data-jump="petroleum"><h3>Petroleum</h3><div class="metric">${num(petroleumStock(p),1)} <small>L</small></div><p>aktueller Bestand</p></button>
  <button class="card cardaction" data-go="costs" data-jump="annualRent"><h3>Jahresmiete</h3><div class="metric">${annualRentFor(p,y)?money(annualRentTotal(annualRentFor(p,y))):'–'}</div><p>Grundbetrag + Zusatznächte</p></button>
  <button class="card cardaction" data-go="costs" data-jump="closing"><h3>Jahresabschluss</h3><div class="metric">${money(total)}</div><p>PDF-Auswertung ${y}</p></button>
  <button class="card cardaction" data-go="more" data-jump="conversations"><h3>Gespräche</h3><div class="metric">${p.conversations.length}</div><p>Gesprächstagebuch</p></button>
  <div class="card full"><h2>Schnellzugriff</h2><div class="quick">
   <button data-add="shopping"><b>＋</b><small>Einkauf</small></button>
   <button data-add="stay"><b>☾</b><small>Übernachtung</small></button>
   <button data-add="conversation"><b>✎</b><small>Gespräch</small></button>
   <button data-add="petroleum"><b>⛽</b><small>Petroleum</small></button>
  </div></div>

function closingRows(p,y){
 const r=[],ar=annualRentFor(p,y);
 if(ar)r.push({d:String(y),c:'Jahresmiete',t:`Grundbetrag ${money(ar.baseAmount)}, ${num(ar.includedNights||90)} inkl., ${num(ar.extraAdultNights)} Erw. x ${money(ar.adultPrice)}, ${num(ar.extraChildNights)} Kinder x ${money(ar.childPrice)}`,a:annualRentTotal(ar)});
 p.costs.filter(x=>Number(x.year)===Number(y)).forEach(x=>r.push({d:String(y),c:{annual:'Jahresgebühr manuell',repairs:'Reparatur',purchases:'Neuanschaffung',other:'Sonstiges'}[x.category]||'Kosten',t:x.note||'',a:Number(x.amount||0)}));
 p.electricity.filter(x=>Number(x.year)===Number(y)).forEach(x=>r.push({d:String(y),c:'Strom',t:`${num(x.consumption,1)} kWh, Strom ${money(x.cost)}, Zählermiete ${money(x.meterRent)}`,a:Number(x.cost||0)+Number(x.meterRent||0)}));
 p.petroleum.filter(x=>x.kind==='purchase'&&(x.date||'').startsWith(String(y))).forEach(x=>r.push({d:fmt(x.date),c:'Petroleum',t:`${num(x.liters,1)} L${x.note?' · '+x.note:''}`,a:Number(x.price||0)}));
 p.gasChecks.filter(x=>(x.date||'').startsWith(String(y))&&Number(x.cost||0)>0).forEach(x=>r.push({d:fmt(x.date),c:'Gasprüfung',t:[x.company,x.result,x.notes].filter(Boolean).join(' · '),a:Number(x.cost||0)}));
 p.contracts.filter(x=>contractActive(x,y)&&contractBaseAmount(x)>0).forEach(x=>{
 const months=contractMonthsInYear(x,y),period=contractBillingPeriod(x);
 r.push({
  d:String(y),
  c:'Vertrag',
  t:[x.name,x.provider,period==='monthly'?`${money(contractBaseAmount(x))} / Monat × ${months} Monat(e)`:`${money(contractBaseAmount(x))} / Jahr`].filter(Boolean).join(' · '),
  a:contractCostForYear(x,y)
 })
});
 return r
}

/* Dokumente lokal in IndexedDB */
const DB='campmanager_documents_v1', STORE='files';
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbPut(k,b){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(b,k);t.oncomplete=()=>{db.close();res()};t.onerror=()=>rej(t.error)})}
async function dbGet(k){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly'),q=t.objectStore(STORE).get(k);q.onsuccess=()=>{db.close();res(q.result||null)};q.onerror=()=>rej(q.error)})}
async function dbDel(k){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(k);t.oncomplete=()=>{db.close();res()};t.onerror=()=>rej(t.error)})}
async function compress(file,max=1800,q=.82){if(!file.type.startsWith('image/'))return file;const bmp=await createImageBitmap(file);let w=bmp.width,h=bmp.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close();return await new Promise(r=>c.toBlob(r,'image/jpeg',q))||file}
const DOCCAT=[['electricity','Strom / Jahresrechnung'],['annual','Stellplatz / Jahresrechnung'],['petroleum','Petroleum'],['repair','Reparatur'],['purchase','Neuanschaffung'],['gas','Gasprüfung'],['contract','Vertrag'],['other','Sonstiges']];
function docLabel(k){return DOCCAT.find(x=>x[0]===k)?.[1]||'Sonstiges'}
function documentPanel(p){const rows=[...p.documents].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `<div class="notice good"><b>Dokumentenscanner:</b> Rechnung fotografieren oder Bild/PDF auswählen.</div><div class="toolbar"><button class="btn" data-docscan>📷 Scannen</button><button class="btn sec" data-docupload>📁 Datei/PDF</button></div><input id="camInput" type="file" accept="image/*" capture="environment" hidden><input id="fileInput" type="file" accept="image/*,application/pdf" hidden>${rows.length?`<div class="docgrid">${rows.map(x=>`<div class="doc"><div class="docthumb" data-docopen="${x.id}">${x.mime?.startsWith('image/')?'🧾':'📄'}</div><div class="rowtitle" style="margin-top:8px">${esc(x.title||docLabel(x.category))}</div><div class="rowsub">${docLabel(x.category)} · ${fmt(x.date)}${x.amount?' · '+money(x.amount):''}</div><div class="toolbar"><button class="mini" data-docopen="${x.id}">Öffnen</button><button class="mini" data-docedit="${x.id}">✎</button><button class="mini danger" data-docdel="${x.id}">×</button></div></div>`).join('')}</div>`:empty('Noch keine Dokumente.')}`}

const area=(l,n,v='')=>`<div class="field full"><label>${esc(l)}</label><textarea name="${n}">${esc(v??'')}</textarea></div>`;
const select=(l,n,v,opts)=>`<div class="field"><label>${esc(l)}</label><select name="${n}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`;

function editor(type,x=null){
 const e=x||{};let title='Eintrag',body='';
 if(type==='shopping'){title='Einkauf';body=field('Artikel','name',e.name,'text','required')+field('Menge','quantity',e.quantity)+area('Notiz','note',e.note)}
 if(type==='cost'){title='Kosten';body=select('Kategorie','category',e.category||'other',[['annual','Jahresgebühr manuell'],['repairs','Reparatur'],['purchases','Neuanschaffung'],['other','Sonstiges']])+field('Jahr','year',e.year||yearNow(),'number','required min="2000"')+field('Betrag €','amount',e.amount,'number','required min="0" step="0.01"')+area('Notiz','note',e.note)}
 if(type==='annualrent'){title='Jahresmiete';body=field('Jahr','year',e.year||yearNow(),'number','required min="2000"')+field('Grundbetrag €','baseAmount',e.baseAmount,'number','required min="0" step="0.01"')+field('Inklusive Übernachtungen','includedNights',e.includedNights||90,'number','required min="0"')+field('Erwachsene € je Übernachtung danach','adultPrice',e.adultPrice,'number','required min="0" step="0.01"')+field('Kinder € je Übernachtung danach','childPrice',e.childPrice,'number','required min="0" step="0.01"')+field('Zusätzliche Erwachsenen-Übernachtungen','extraAdultNights',e.extraAdultNights||0,'number','required min="0"')+field('Zusätzliche Kinder-Übernachtungen','extraChildNights',e.extraChildNights||0,'number','required min="0"')+area('Notiz','note',e.note)}
 if(type==='petroleum'){title='Petroleum';body=select('Art','kind',e.kind||'purchase',[['purchase','Einkauf'],['usage','Verbrauch'],['stock','Bestand setzen']])+field('Datum','date',e.date||today(),'date','required')+field('Liter','liters',e.liters,'number','required min="0" step="0.1"')+field('Preis gesamt €','price',e.price,'number','min="0" step="0.01"')+area('Notiz','note',e.note)}
 if(type==='electricity'){title='Strom Jahreswert';body=field('Jahr','year',e.year||yearNow(),'number','required min="2000"')+field('Verbrauch kWh','consumption',e.consumption,'number','required min="0" step="0.1"')+field('Stromkosten €','cost',e.cost,'number','min="0" step="0.01"')+field('Zählermiete €','meterRent',e.meterRent,'number','min="0" step="0.01"')}
 if(type==='lawn'||type==='hedge'){title=type==='lawn'?'Rasenschnitt':'Heckenschnitt';body=field('Datum','date',e.date||today(),'date','required')+area('Notiz','note',e.note)}
 if(type==='stay'){title='Aufenthalt';body=field('Anreise','arrival',e.arrival||today(),'date','required')+field('Abreise','departure',e.departure,'date','required')+field('Personen','people',e.people)+area('Notiz','note',e.note)}
 if(type==='conversation'){title='Gespräch';body=field('Datum','date',e.date||today(),'date','required')+field('Uhrzeit','time',e.time||new Date().toTimeString().slice(0,5),'time','required')+field('Gesprächspartner','partner',e.partner,'text','required')+area('Notiz','note',e.note)}
 if(type==='contract'){
  title='Vertrag';
  const legacyAmount=e.costAmount ?? e.annualCost ?? '';
  body=field('Vertrag','name',e.name,'text','required')
   +field('Anbieter','provider',e.provider)
   +field('Vertragsbeginn','startDate',e.startDate,'date')
   +field('Vertragsende','endDate',e.endDate,'date')
   +field('Kündigungs-/Prüffrist','noticeDate',e.noticeDate,'date')
   +select('Abrechnung','billingPeriod',e.billingPeriod||'yearly',[['monthly','Monatlich'],['yearly','Jährlich']])
   +field('Betrag €','costAmount',legacyAmount,'number','min="0" step="0.01"')
   +area('Notiz','notes',e.notes)
 }
 if(type==='gas'){title='Gasprüfung';body=field('Prüfdatum','date',e.date||today(),'date','required')+field('Nächste Prüfung','nextDue',e.nextDue,'date')+select('Ergebnis','result',e.result||'bestanden',[['bestanden','Bestanden'],['maengel','Mängel'],['offen','Offen']])+field('Prüfer/Firma','company',e.company)+field('Kosten €','cost',e.cost,'number','min="0" step="0.01"')+area('Notiz','notes',e.notes)}
 if(type==='family'){title='Person';body=field('Name','name',e.name,'text','required')}
 modal(title,`<form id="editForm" data-type="${type}" data-id="${e.id||''}"><div class="formgrid">${body}</div></form>`,actions('editForm'))
}
function saveEditor(form){
 const type=form.dataset.type,id=form.dataset.id||null,arr=coll(type),old=id?arr.find(x=>x.id===id):null,item={...(old||{}),...Object.fromEntries(new FormData(form).entries()),id:id||uid(),createdAt:old?.createdAt||new Date().toISOString()};
 if(type==='shopping')item.done=old?!!old.done:false;
 if(type==='contract'){
  item.billingPeriod=item.billingPeriod||'yearly';
  if(item.costAmount!==undefined)delete item.annualCost;
 }
 if(type==='stay'&&item.departure<item.arrival){toast('Abreise liegt vor der Anreise');return}
 if(type==='electricity'&&!id&&arr.some(x=>String(x.year)===String(item.year))){toast('Stromwert für dieses Jahr existiert bereits');return}
 if(type==='annualrent'&&!id&&arr.some(x=>String(x.year)===String(item.year))){toast('Jahresmiete für dieses Jahr existiert bereits');return}
 if(type==='hedge'&&!id){const y=item.date.slice(0,4);if(arr.filter(x=>(x.date||'').startsWith(y)).length>=2){toast('Maximal 2 Heckenschnitte pro Jahr');return}}
 if(old)Object.assign(old,item);else arr.push(item);closeModal();save();toast('Gespeichert')
}
async function imgData(file,max=420,q=.78){const b=await createImageBitmap(file);let w=b.width,h=b.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);b.close();return c.toDataURL('image/jpeg',q)}
function placeEditor(id=null){
 const p=id?state.places.find(x=>x.id===id):null,e=p?.site||{};
 modal(p?'Stellplatz bearbeiten':'Stellplatz hinzufügen',`<form id="placeForm" data-id="${id||''}"><div class="formgrid"><div class="field full"><label>Profilbild</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${e.photoData?`<img id="photoPrev" class="photoPreview" src="${e.photoData}">`:`<span id="photoEmpty" class="photoPreview" style="display:grid;place-items:center;font-size:30px">⛺</span>`}<div><label class="btn sec">📷 Bild wählen<input id="photoInput" type="file" accept="image/*" capture="environment" hidden></label>${e.photoData?`<button type="button" class="btn sec" id="photoRemove" style="margin-top:6px">Bild entfernen</button>`:''}</div></div><input type="hidden" name="photoData" value="${esc(e.photoData||'')}"></div>${field('Campingplatz / Name','campName',e.campName,'text','required')}${field('Stellplatznummer','pitch',e.pitch,'text','required')}${field('Fläche m²','area',e.area,'number','min="0" step="0.1"')}${area('Notizen','notes',e.notes)}</div></form>`,actions('placeForm'));
 $('#photoInput').onchange=async()=>{const f=$('#photoInput').files?.[0];if(!f)return;const data=await imgData(f);$('#placeForm [name="photoData"]').value=data;const old=$('#photoPrev')||$('#photoEmpty');const img=document.createElement('img');img.id='photoPrev';img.className='photoPreview';img.src=data;old.replaceWith(img)};
 if($('#photoRemove'))$('#photoRemove').onclick=()=>{$('#placeForm [name="photoData"]').value='';const old=$('#photoPrev');const s=document.createElement('span');s.id='photoEmpty';s.className='photoPreview';s.style.cssText='display:grid;place-items:center;font-size:30px';s.textContent='⛺';old?.replaceWith(s);$('#photoRemove')?.remove()}

function savePlace(form){
 const id=form.dataset.id||null,data=Object.fromEntries(new FormData(form).entries()),p=id?state.places.find(x=>x.id===id):null;
 if(p)p.site={...p.site,...data};else{const n=blankPlace(data.campName,data.pitch);n.site={...n.site,...data};state.places.push(n);state.activePlaceId=n.id}
 closeModal();save();toast('Stellplatz gespeichert')
}
function switcher(){modal('Stellplatz wechseln',`<div class="list">${state.places.map(p=>`<button type="button" class="row" data-placeswitch="${p.id}" style="width:100%;text-align:left">${avatar(p)}<div class="rowmain"><div class="rowtitle">${esc(p.site.campName)} · Platz ${esc(p.site.pitch||'–')}</div><div class="rowsub">${p.id===state.activePlaceId?'Aktiv':'Antippen zum Wechseln'}</div></div></button>`).join('')}</div><div class="toolbar"><button class="btn" data-placeadd>＋ Neuer Platz</button></div>`,`<button class="btn sec" type="button" data-close>Schließen</button>`)}

async function handleDoc(file){
 if(!file)return;if(file.size>25*1024*1024){toast('Datei zu groß');return}
 const id=uid(),blob=await compress(file);await dbPut(id,blob);
 docEditor({id,mime:blob.type||file.type,filename:file.name,size:blob.size,createdAt:new Date().toISOString()},true)
}
function docEditor(x,isNew=false){modal(isNew?'Dokument speichern':'Dokument bearbeiten',`<form id="docForm" data-id="${x.id}" data-new="${isNew?'1':'0'}"><div class="formgrid">${field('Titel','title',x.title||'Rechnung')}${select('Kategorie','category',x.category||'other',DOCCAT)}${field('Belegdatum','date',x.date||today(),'date','required')}${field('Jahr','year',x.year||yearNow(),'number','min="2000"')}${field('Betrag €','amount',x.amount||'','number','min="0" step="0.01"')}${area('Notiz','note',x.note||'')}</div></form>`,actions('docForm'))}
async function openDoc(id){const b=await dbGet(id);if(!b){toast('Datei nicht gefunden');return}const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.target='_blank';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function delDoc(id){if(!confirm('Dokument löschen?'))return;place().documents=place().documents.filter(x=>x.id!==id);await dbDel(id).catch(()=>{});save();toast('Dokument gelöscht')}

function deleteItem(type,id){if(!confirm('Eintrag wirklich löschen?'))return;const a=coll(type),i=a.findIndex(x=>x.id===id);if(i>=0){a.splice(i,1);save()}}
function editItem(type,id){const x=coll(type).find(x=>x.id===id);if(x)editor(type,x)}
function deletePlace(id){if(state.places.length<=1){toast('Mindestens ein Platz muss bleiben');return}if(!confirm('Stellplatz wirklich löschen?'))return;state.places=state.places.filter(x=>x.id!==id);if(state.activePlaceId===id)state.activePlaceId=state.places[0].id;save()}
function switchPlace(id){state.activePlaceId=id;closeModal();save();toast('Stellplatz gewechselt')}

/* optionaler Supabase Sync */
let cfg=(()=>{try{return JSON.parse(localStorage.getItem(CFG)||'{}')}catch{return{}}})(),session=(()=>{try{return JSON.parse(localStorage.getItem(SES)||'null')}catch{return null}})(),pushTimer=null;
function cloudReady(){return !!(cfg.url&&cfg.key)}
function cloudBase(){return String(cfg.url||'').replace(/\/+$/,'')}
async function api(path,{method='GET',body=null,token=null,prefer=null}={}){const h={apikey:cfg.key,Authorization:'Bearer '+(token||cfg.key)};if(body!==null)h['Content-Type']='application/json';if(prefer)h.Prefer=prefer;const r=await fetch(cloudBase()+path,{method,headers:h,body:body!==null?JSON.stringify(body):undefined});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error_description||('HTTP '+r.status));return d}
async function login(email,password){session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});localStorage.setItem(SES,JSON.stringify(session));render()}
async function signup(email,password){const s=await api('/auth/v1/signup',{method:'POST',body:{email,password}});if(s?.access_token){session=s;localStorage.setItem(SES,JSON.stringify(s));await pushCloud()}return s}
async function pushCloud(){if(!cloudReady()||!session?.access_token)return;try{const id=session.user?.id;if(!id)return;await api('/rest/v1/camp_states?on_conflict=user_id',{method:'POST',token:session.access_token,prefer:'resolution=merge-duplicates,return=minimal',body:{user_id:id,data:state,updated_at:new Date().toISOString()}});$('#syncStatus').textContent='Cloud'}catch(e){console.warn(e);$('#syncStatus').textContent='Cloud-Fehler'}}
async function pullCloud(){if(!cloudReady()||!session?.access_token)return;try{const id=session.user?.id;if(!id)return;const r=await api('/rest/v1/camp_states?select=data&user_id=eq.'+encodeURIComponent(id)+'&limit=1',{token:session.access_token});if(r?.[0]?.data){state=normalize(r[0].data);persist();render()}}catch(e){console.warn(e)}}
function schedulePush(){if(!cloudReady()||!session?.access_token)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushCloud,700)}
const SQL=`create table if not exists public.camp_states (
  user_id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table public.camp_states enable row level security;
drop policy if exists "camp_select_own" on public.camp_states;
create policy "camp_select_own" on public.camp_states for select using (auth.uid() = user_id);
drop policy if exists "camp_insert_own" on public.camp_states;
create policy "camp_insert_own" on public.camp_states for insert with check (auth.uid() = user_id);
drop policy if exists "camp_update_own" on public.camp_states;
create policy "camp_update_own" on public.camp_states for update using (auth.uid() = user_id) with check (auth.uid() = user_id);`;

function settings(){
 modal('Einstellungen',`<h3>Cloud-Sync (optional)</h3><form id="cfgForm"><div class="formgrid">${field('Supabase Project URL','url',cfg.url||'','url')}${field('Publishable / Anon Key','key',cfg.key||'')}</div></form><div class="toolbar"><button class="btn sec" id="saveCfg">Cloud-Daten speichern</button><button class="btn sec" id="showSql">SQL anzeigen</button></div>${cloudReady()&&!session?.access_token?`<form id="authForm"><div class="formgrid">${field('Familien-E-Mail','email','','email','required')}${field('Passwort','password','','password','required minlength="6"')}</div></form><div class="toolbar"><button class="btn" id="login">Anmelden</button><button class="btn sec" id="signup">Konto erstellen</button></div>`:''}${session?.access_token?`<div class="notice good">Cloud angemeldet</div><div class="toolbar"><button class="btn" id="pull">Cloud laden</button><button class="btn" id="push">Cloud speichern</button><button class="btn sec" id="logout">Abmelden</button></div>`:''}<div class="divider"></div><h3>Backup</h3><div class="toolbar"><button class="btn sec" id="backupOut">Backup exportieren</button><label class="btn sec">Backup importieren<input id="backupIn" type="file" accept="application/json" hidden></label></div><div class="notice warn">Gescannte Bild-/PDF-Dateien liegen aktuell lokal auf dem jeweiligen Gerät; ihre Metadaten werden mitgesichert.</div>`,`<button class="btn sec" type="button" data-close>Schließen</button>`);
 $('#saveCfg').onclick=()=>{const d=Object.fromEntries(new FormData($('#cfgForm')).entries());cfg={url:String(d.url||'').trim().replace(/\/+$/,''),key:String(d.key||'').trim()};localStorage.setItem(CFG,JSON.stringify(cfg));toast('Cloud-Daten gespeichert');closeModal();settings()};
 $('#showSql').onclick=()=>modal('Supabase SQL',`<pre style="white-space:pre-wrap;background:#132019;color:#e8efe9;padding:10px;border-radius:12px;font-size:11px">${esc(SQL)}</pre>`,`<button class="btn sec" type="button" data-close>Schließen</button>`);
 if($('#login'))$('#login').onclick=async()=>{const d=Object.fromEntries(new FormData($('#authForm')).entries());try{await login(d.email,d.password);await pullCloud();closeModal();toast('Angemeldet')}catch(e){toast('Anmeldung fehlgeschlagen')}};
 if($('#signup'))$('#signup').onclick=async()=>{const d=Object.fromEntries(new FormData($('#authForm')).entries());try{const s=await signup(d.email,d.password);toast(s?.access_token?'Konto erstellt':'Bitte E-Mail bestätigen')}catch{toast('Konto konnte nicht erstellt werden')}};
 if($('#pull'))$('#pull').onclick=()=>pullCloud();
 if($('#push'))$('#push').onclick=()=>pushCloud();
 if($('#logout'))$('#logout').onclick=()=>{session=null;localStorage.removeItem(SES);closeModal();render();toast('Abgemeldet')};
 $('#backupOut').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='campmanager-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
 $('#backupIn').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{state=normalize(JSON.parse(await f.text()));save();closeModal();toast('Backup importiert')}catch{toast('Ungültiges Backup')}}
}

document.addEventListener('submit',e=>{
 const f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();if(!f.reportValidity())return;
 if(f.id==='editForm'){saveEditor(f);return}
 if(f.id==='placeForm'){savePlace(f);return}
 if(f.id==='docForm'){const d=Object.fromEntries(new FormData(f).entries()),id=f.dataset.id;let x=place().documents.find(x=>x.id===id);if(!x){x={id,createdAt:new Date().toISOString()};place().documents.push(x)}Object.assign(x,d);closeModal();save();toast('Dokument gespeichert');return}
});
document.addEventListener('click',e=>{
 if(e.target.closest('[data-close]')){closeModal();return}
 const n=e.target.closest('[data-view]');if(n){show(n.dataset.view);return}
 const g=e.target.closest('[data-go]');if(g){const v=g.dataset.go;if(g.dataset.jump)tab[v]=g.dataset.jump;render();show(v);return}
 const tj=e.target.closest('[data-tabsec]');if(tj){tab[tj.dataset.tabsec]=tj.dataset.tab;render();show(tj.dataset.tabsec);return}
 const cj=e.target.closest('[data-costjump]');if(cj){tab.costs=cj.dataset.costjump;renderCosts();show('costs');return}
 const a=e.target.closest('[data-add]');if(a){editor(a.dataset.add);return}
 const ed=e.target.closest('[data-edit]');if(ed){editItem(ed.dataset.edit,ed.dataset.id);return}
 const de=e.target.closest('[data-del]');if(de){deleteItem(de.dataset.del,de.dataset.id);return}
 const ps=e.target.closest('[data-placeswitch]');if(ps){switchPlace(ps.dataset.placeswitch);return}
 const pe=e.target.closest('[data-placeedit]');if(pe){closeModal();placeEditor(pe.dataset.placeedit);return}
 if(e.target.closest('[data-placeadd]')){closeModal();placeEditor();return}
 const pd=e.target.closest('[data-placedel]');if(pd){deletePlace(pd.dataset.placedel);return}
 if(e.target.closest('[data-docscan]')){$('#camInput')?.click();return}
 if(e.target.closest('[data-docupload]')){$('#fileInput')?.click();return}
 const dop=e.target.closest('[data-docopen]');if(dop){openDoc(dop.dataset.docopen);return}
 const ded=e.target.closest('[data-docedit]');if(ded){const x=place().documents.find(x=>x.id===ded.dataset.docedit);if(x)docEditor(x,false);return}
 const ddl=e.target.closest('[data-docdel]');if(ddl){delDoc(ddl.dataset.docdel);return}
 if(e.target.id==='pdfBtn'){openPdf();return}
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-check]')){const x=place().shopping.find(x=>x.id===e.target.dataset.check);if(x){x.done=e.target.checked;save()}return}
 if(e.target.id==='closeYear'){closingYear=Number(e.target.value)||yearNow();renderCosts();show('costs');return}
 if(e.target.id==='camInput'||e.target.id==='fileInput'){const f=e.target.files?.[0];e.target.value='';if(f)handleDoc(f);return}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
$('#homeBtn').onclick=()=>show('dashboard');
$('#placeBtn').onclick=switcher;
$('#settingsBtn').onclick=settings;
$('#logoImg').onerror=()=>$('#logoImg').style.display='none';

(async()=>{try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}}catch{}render();if(cloudReady()&&session?.access_token)pullCloud()})();
})();
</script>
</body>
</html>
